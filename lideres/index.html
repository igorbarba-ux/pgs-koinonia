<title>Episkopos · PGs Koinonia</title>
<link rel="manifest" href="manifest-episkopos.json">
<meta name="theme-color" content="#AD1E2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Episkopos">
<link rel="apple-touch-icon" href="icon-episkopos-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-episkopos-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* ── Tokens ─────────────────────────────────────────────────────────
     Paleta oficial da Batista Koinonia (deck "Conhecendo o Cuidar"):
     vinho #AD1E2E, creme #F4EEDC, cinza #595959 e a roda das quatro
     áreas — âmbar #FAB000, coral #EF765E, verde-água #54BCAB, malva
     #B36F9B. As cores da roda são tons médios: entram puras (--*-pure)
     em barras e preenchimentos, e escurecidas quando viram texto. */
  :root{
    --bg:#F4EEDC; --surface:#FFFFFF; --surface-2:#EFE7D2; --border:#DFD3B8;
    --ink:#241F1B; --ink-muted:#595959; --ink-faint:#6E6558;
    --accent:#AD1E2E; --accent-soft:#F7E3E4; --accent-ink:#8A1724;
    --good:#0A6E61; --good-pure:#54BCAB; --good-soft:#DDF1ED;
    --bad:#B33F28;  --bad-pure:#EF765E;  --bad-soft:#FBE7E1;
    --warn:#8F6100; --warn-pure:#FAB000; --warn-soft:#FDF0D2;
    --clay:#834C6E; --clay-pure:#B36F9B; --clay-soft:#F2E6EE;
    --shadow:0 1px 2px rgba(74,44,18,.06), 0 10px 28px rgba(74,44,18,.06);
    --shadow-lift:0 4px 10px rgba(74,44,18,.09), 0 16px 32px rgba(74,44,18,.11);
    --overlay:rgba(36,26,14,.45);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#17120E; --surface:#211A15; --surface-2:#2C231C; --border:#3E3327;
      --ink:#F2E9DC; --ink-muted:#B5A895; --ink-faint:#8A7F70;
      --accent:#E8737E; --accent-soft:#3A1A1E; --accent-ink:#F4AEB4;
      --good:#63CDBB; --good-pure:#54BCAB; --good-soft:#12302C;
      --bad:#F2907A;  --bad-pure:#EF765E;  --bad-soft:#3A2019;
      --warn:#F0B33A; --warn-pure:#FAB000; --warn-soft:#342611;
      --clay:#C98FB4; --clay-pure:#B36F9B; --clay-soft:#2F1F2A;
      --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 28px rgba(0,0,0,.4);
      --shadow-lift:0 4px 10px rgba(0,0,0,.5), 0 16px 32px rgba(0,0,0,.45);
      --overlay:rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#17120E; --surface:#211A15; --surface-2:#2C231C; --border:#3E3327;
    --ink:#F2E9DC; --ink-muted:#B5A895; --ink-faint:#8A7F70;
    --accent:#E8737E; --accent-soft:#3A1A1E; --accent-ink:#F4AEB4;
    --good:#63CDBB; --good-pure:#54BCAB; --good-soft:#12302C;
    --bad:#F2907A;  --bad-pure:#EF765E;  --bad-soft:#3A2019;
    --warn:#F0B33A; --warn-pure:#FAB000; --warn-soft:#342611;
    --clay:#C98FB4; --clay-pure:#B36F9B; --clay-soft:#2F1F2A;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 28px rgba(0,0,0,.4);
    --shadow-lift:0 4px 10px rgba(0,0,0,.5), 0 16px 32px rgba(0,0,0,.45);
    --overlay:rgba(0,0,0,.6);
  }

  *{box-sizing:border-box;}
  body{background:var(--bg); color:var(--ink); font-family:"Public Sans", ui-sans-serif, system-ui, sans-serif; font-size:14px; line-height:1.5;}
  h1,h2,h3,h4{font-family:"Spectral", Georgia, serif; text-wrap:balance; margin:0;}
  .mono{font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums;}
  a{color:var(--accent);}
  @media (prefers-reduced-motion: no-preference){
    .section.active{animation:fadeIn .25s ease both;}
    @keyframes fadeIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}
  }

  .shell{display:flex; min-height:100vh;}

  /* ---------------- Sidebar ---------------- */
  .sidebar{
    width:256px; flex:none; background:var(--surface); border-right:1px solid var(--border);
    padding:22px 14px; display:flex; flex-direction:column; gap:14px;
    position:sticky; top:env(safe-area-inset-top, 0px); height:100vh; overflow-y:auto;
  }
  .brand{padding:0 6px; display:flex; align-items:center; gap:12px; position:relative;}
  .brand .mark{display:inline-flex; align-items:center; justify-content:center; flex:none; width:58px; height:58px;}
  .brand .mark img{width:100%; height:100%; object-fit:contain;}
  .brand .brand-txt h1{font-size:19px; font-weight:600; color:var(--ink); line-height:1.1;}
  .brand .brand-txt p{margin:2px 0 0; font-size:11.5px; color:var(--ink-muted);}

  .side-search{position:relative; margin:2px 0 0;}
  .side-search svg{position:absolute; left:9px; top:50%; transform:translateY(-50%); color:var(--ink-faint);}
  .side-search input{
    width:100%; background:var(--bg); border:1px solid var(--border); border-radius:8px;
    padding:7px 10px 7px 30px; font-size:12.5px; color:var(--ink); font-family:"Public Sans";
  }
  .side-search input:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .side-results{position:absolute; z-index:30; top:calc(100% + 4px); left:0; right:0; background:var(--surface); border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow); max-height:280px; overflow-y:auto; display:none;}
  .side-results.show{display:block;}
  .side-results button{all:unset; cursor:pointer; display:block; width:100%; padding:8px 10px; font-size:12px; color:var(--ink); box-sizing:border-box;}
  .side-results button:hover{background:var(--surface-2);}
  .side-results button:focus-visible{outline:2px solid var(--accent); outline-offset:-2px; background:var(--surface-2);}
  .side-results button .r-sub{display:block; font-size:10.5px; color:var(--ink-faint); margin-top:1px;}
  .side-results .no-res{padding:10px; font-size:12px; color:var(--ink-faint);}

  nav{display:flex; flex-direction:column; gap:2px;}
  .nav-label{font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint); padding:10px 10px 4px;}
  .nav-btn{
    all:unset; cursor:pointer; padding:7px 10px; border-radius:7px; font-size:13.5px;
    color:var(--ink-muted); display:flex; align-items:center; gap:8px; box-sizing:border-box;
  }
  .nav-btn svg{flex:none; color:var(--ink-faint);}
  .nav-btn:hover{background:var(--surface-2); color:var(--ink);}
  .nav-btn:focus-visible{outline:2px solid var(--accent); outline-offset:-2px;}
  .nav-btn.active{background:var(--accent-soft); color:var(--accent-ink); font-weight:600;}
  .nav-btn.active svg{color:var(--accent-ink);}
  .nav-btn .lbl{flex:1;}
  .nav-btn .pill{font-family:"IBM Plex Mono"; font-size:10.5px; color:var(--ink-faint);}
  .nav-btn.active .pill{color:var(--accent-ink);}

  .sidebar-foot{margin-top:auto; padding:12px 10px 0; font-size:11.5px; color:var(--ink-faint); border-top:1px solid var(--border); line-height:1.6;}
  .sync-state{display:flex; align-items:center; gap:6px; font-size:11px; color:var(--good); padding:0 10px 8px;}
  .sync-state .dot{width:6px; height:6px; border-radius:50%; background:var(--good-pure);}

  main{flex:1; min-width:0; padding:32px 40px 60px;}
  .section{display:none;}
  .section.active{display:block;}
  .section-head{margin-bottom:22px;}
  .eyebrow{font-size:11.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--accent); font-weight:600; margin-bottom:6px;}
  .section-head h2{font-size:27px; font-weight:600;}
  .section-sub{color:var(--ink-muted); font-size:13.5px; margin-top:6px; max-width:70ch;}

  h3.block-title{font-size:15px; font-weight:600; margin:30px 0 4px; display:flex; align-items:center; gap:8px;}
  p.block-sub{font-size:12.5px; color:var(--ink-muted); margin:0 0 14px; max-width:70ch;}

  /* ---------------- Hero ---------------- */
  .event-banner{display:flex; align-items:center; gap:14px; background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); padding:16px 18px; margin-top:22px;}
  .event-banner .eb-icon{flex:none; width:40px; height:40px; border-radius:10px; background:var(--accent-soft); color:var(--accent-ink); display:flex; align-items:center; justify-content:center;}
  .event-banner .eb-icon svg{width:19px; height:19px;}
  .event-banner .eb-txt{flex:1; min-width:0;}
  .event-banner .eb-lab{font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); font-weight:600;}
  .event-banner .eb-name{font-family:"Spectral", Georgia, serif; font-size:16.5px; font-weight:600; margin-top:2px; line-height:1.3;}
  .event-banner .eb-when{font-size:12.5px; color:var(--ink-muted); margin-top:2px;}
  .event-banner .eb-btn{all:unset; cursor:pointer; box-sizing:border-box; flex:none; font-size:12.5px; font-weight:600; color:var(--accent-ink); background:var(--accent-soft); padding:9px 15px; border-radius:8px; white-space:nowrap;}
  .event-banner .eb-btn:hover{background:var(--accent); color:#fff;}
  .event-banner .eb-btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  @media (max-width: 560px){
    .event-banner{flex-wrap:wrap;}
    .event-banner .eb-btn{margin-left:54px;}
  }
  .hero-grid{display:grid; grid-template-columns:260px 1fr; gap:16px; margin:22px 0 8px;}
  .donut-card{background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); padding:20px; display:flex; flex-direction:column; align-items:center; gap:12px; position:relative; overflow:hidden;}
  .donut-card::before{content:''; position:absolute; top:-60px; right:-60px; width:180px; height:180px; border-radius:50%; background:radial-gradient(circle, var(--accent-soft) 0%, transparent 72%); opacity:.8; pointer-events:none;}
  .donut-card > *{position:relative;}
  .donut-card .donut-title{font-size:12px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em; align-self:flex-start;}
  .donut-figure{position:relative; width:150px; height:150px;}
  .donut-figure .donut-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .donut-figure .donut-center .big{font-family:"IBM Plex Mono"; font-size:26px; font-weight:600;}
  .donut-figure .donut-center .lbl{font-size:10.5px; color:var(--ink-muted); margin-top:1px;}
  .donut-legend{display:flex; gap:16px; font-size:12px;}
  .donut-legend .li{display:flex; align-items:center; gap:6px; color:var(--ink-muted);}
  .donut-legend .sw{width:9px; height:9px; border-radius:3px; flex:none;}
  .donut-legend .li b{color:var(--ink); font-family:"IBM Plex Mono"; font-weight:600;}

  .kpi-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(170px,1fr)); gap:12px;}
  .kpi{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:15px 17px; box-shadow:var(--shadow); transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;}
  .kpi:hover{transform:translateY(-2px); border-color:var(--accent); box-shadow:var(--shadow-lift);}
  .kpi .label{font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); margin-bottom:8px;}
  .kpi .value{font-family:"IBM Plex Mono"; font-size:23px; font-weight:600; font-variant-numeric:tabular-nums;}
  .kpi .value.bad{color:var(--bad);}
  .kpi .value.warn{color:var(--warn);}
  .kpi .sub{font-size:12px; color:var(--ink-muted); margin-top:4px;}

  /* ---------------- Atenção ---------------- */
  .attn-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(230px,1fr)); gap:12px; margin:14px 0 28px;}
  .attn-card{background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--border); border-radius:10px; box-shadow:var(--shadow); padding:13px 15px; transition:transform .18s ease, box-shadow .18s ease;}
  .attn-card:hover{transform:translateY(-2px); box-shadow:var(--shadow-lift);}
  .attn-card.crit{border-left-color:var(--bad);}
  .attn-card.warn{border-left-color:var(--warn);}
  .attn-card.info{border-left-color:var(--accent);}
  .attn-head{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
  .attn-head svg{flex:none;}
  .attn-card.crit svg{color:var(--bad);}
  .attn-card.warn svg{color:var(--warn);}
  .attn-card.info svg{color:var(--accent);}
  .attn-head .t{font-size:13px; font-weight:600; color:var(--ink); flex:1;}
  .attn-head .n{font-family:"IBM Plex Mono"; font-size:15px; font-weight:600;}
  .attn-card.crit .n{color:var(--bad);}
  .attn-card.warn .n{color:var(--warn);}
  .attn-card.info .n{color:var(--accent-ink);}
  .attn-body{font-size:12px; color:var(--ink-muted); line-height:1.6;}
  .attn-body .item{display:block;}

  /* ---------------- Barras ---------------- */
  .bar-rank{display:flex; flex-direction:column; gap:9px; margin:14px 0 6px;}
  .bar-rank-row{display:grid; grid-template-columns:130px 1fr 128px; align-items:center; gap:10px;}
  .bar-rank-row .cat-name{font-size:12.5px; color:var(--ink-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .bar-rank-row .bar-track{background:var(--surface-2); border-radius:5px; height:20px; position:relative; overflow:hidden; display:flex;}
  .bar-rank-row .bar-fill{height:100%;}
  .bar-rank-row .bar-fill.good{background:var(--good-pure);}
  .bar-rank-row .bar-fill.bad{background:var(--bad-pure); margin-left:1px;}
  .bar-rank-row .bar-amt{font-family:"IBM Plex Mono"; font-size:12px; text-align:right; white-space:nowrap;}
  .bar-rank-row .bar-amt .sub{color:var(--ink-faint); margin-left:5px; font-size:11px;}
  .bar-legend{display:flex; gap:16px; font-size:11.5px; color:var(--ink-muted); margin:2px 0 18px; flex-wrap:wrap;}
  .bar-legend .li{display:flex; align-items:center; gap:6px;}
  .bar-legend .sw{width:9px; height:9px; border-radius:3px;}

  /* ---------------- Agenda semanal ---------------- */
  .week-board{display:flex; gap:12px; overflow-x:auto; padding-bottom:8px; margin-top:14px;}
  .week-col{background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); flex:none; width:216px; display:flex; flex-direction:column;}
  .week-col-head{padding:12px 14px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;}
  .week-col-head .d{font-size:13px; font-weight:600;}
  .week-col-head .pill{font-family:"IBM Plex Mono"; font-size:11px; color:var(--ink-faint); background:var(--surface-2); border-radius:20px; padding:1px 7px;}
  .week-col-body{padding:8px; display:flex; flex-direction:column; gap:7px; max-height:620px; overflow-y:auto;}
  .week-chip{all:unset; cursor:pointer; box-sizing:border-box; display:block; width:100%; background:var(--bg); border:1px solid var(--border); border-radius:9px; padding:8px 10px; border-left:3px solid var(--border);}
  .week-chip:hover{border-color:var(--accent); background:var(--accent-soft);}
  .week-chip:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
  .week-chip .time{display:block; font-family:"IBM Plex Mono"; font-size:11px; color:var(--accent-ink); font-weight:600;}
  .week-chip .pgname{display:block; font-size:12.5px; font-weight:500; color:var(--ink); margin-top:2px;}
  .week-chip .meta{font-size:11px; color:var(--ink-muted); margin-top:3px; display:flex; align-items:center; gap:5px; flex-wrap:wrap;}
  .week-chip .meta .camp{background:var(--surface-2); border-radius:5px; padding:0 5px;}
  .week-empty{padding:20px 10px; text-align:center; color:var(--ink-faint); font-size:12px;}

  /* ---------------- Tabelas ---------------- */
  .table-card{background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); overflow:hidden;}
  .table-toolbar{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--border); flex-wrap:wrap;}
  .table-toolbar h3{font-size:14.5px; font-weight:600; color:var(--ink);}
  .toolbar-controls{display:flex; gap:8px; flex-wrap:wrap;}
  .search-wrap{position:relative;}
  .search-wrap svg{position:absolute; left:8px; top:50%; transform:translateY(-50%); color:var(--ink-faint); pointer-events:none;}
  .search{background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:6px 10px 6px 28px; font-size:12.5px; color:var(--ink); font-family:"Public Sans"; width:210px;}
  .fselect{background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:6px 10px; font-size:12.5px; color:var(--ink); font-family:"Public Sans";}
  .search:focus, .fselect:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .table-scroll{overflow-x:auto; max-height:600px; overflow-y:auto;}
  table{width:100%; border-collapse:collapse; min-width:680px;}
  thead th{position:sticky; top:0; background:var(--surface); text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); padding:10px 16px; border-bottom:1px solid var(--border); font-weight:600; white-space:nowrap; z-index:1;}
  thead th.num{text-align:right;}
  thead th.sortable{cursor:pointer; user-select:none;}
  thead th.sortable:hover{color:var(--ink);}
  thead th.sortable .arrow{display:inline-block; width:10px; opacity:.5;}
  thead th.sortable.active .arrow{opacity:1; color:var(--accent-ink);}
  thead th.sortable:focus-visible{outline:2px solid var(--accent); outline-offset:-2px;}
  tbody td{padding:8px 16px; border-bottom:1px solid var(--border); font-size:13px; vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover td{background:var(--surface-2);}
  tr.clickable{cursor:pointer;}
  tr.clickable:focus-visible{outline:2px solid var(--accent); outline-offset:-2px;}
  td.name{color:var(--ink); font-weight:500;}
  td.name .sub{display:block; font-size:11.5px; color:var(--ink-faint); font-weight:400; margin-top:1px;}
  td.num{text-align:right; font-family:"IBM Plex Mono"; white-space:nowrap;}
  td.tags{color:var(--ink-muted); font-size:12.5px;}
  td.person{white-space:nowrap;}
  .person-name{display:inline-flex; align-items:center; gap:6px;}
  .empty-row td{padding:26px 16px; text-align:center; color:var(--ink-faint); font-size:13px;}
  .role-badge{display:inline-block; font-size:9.5px; text-transform:uppercase; letter-spacing:.03em; font-weight:700; border-radius:20px; padding:2px 8px;}
  .role-badge.lider{color:var(--accent-ink); background:var(--accent-soft);}
  .role-badge.colider{color:var(--ink-muted); background:var(--surface-2); border:1px solid var(--border);}
  .status-badge{font-size:10px; text-transform:uppercase; letter-spacing:.05em; font-weight:700; padding:3px 8px; border-radius:20px; white-space:nowrap; display:inline-flex; align-items:center; gap:4px;}
  .status-badge.ativo{background:var(--good-soft); color:var(--good);}
  .status-badge.nao{background:var(--bad-soft); color:var(--bad); border:1px dashed var(--bad);}
  .status-badge.warn{background:var(--warn-soft); color:var(--warn);}

  .mtag{display:inline-block; font-size:10.5px; padding:2px 8px; border-radius:20px; background:var(--surface-2); color:var(--ink-muted); white-space:nowrap;}
  .mtag.none{background:var(--warn-soft); color:var(--warn);}

  .wa-btn{display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:50%; background:var(--good-soft); color:var(--good); flex:none; transition:transform .12s ease;}
  .wa-btn:hover{transform:scale(1.12);}
  .wa-btn svg{width:12px; height:12px;}
  .no-contact{color:var(--ink-faint); font-size:11px;}

  /* ---------------- Campus ---------------- */
  .campus-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(215px,1fr)); gap:12px; margin:14px 0 22px;}
  .campus-card{all:unset; cursor:pointer; box-sizing:border-box; background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); padding:14px 16px; display:flex; flex-direction:column; gap:8px;}
  .campus-card.active{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft), var(--shadow);}
  .campus-card:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .campus-card .cc-name{display:block; font-size:14px; font-weight:600; color:var(--ink);}
  .campus-card .cc-coord{display:block; font-size:11.5px; color:var(--ink-muted);}
  .campus-card .cc-coord.missing{color:var(--ink-faint); font-style:italic;}
  .campus-card .cc-stats{font-size:11.5px; color:var(--ink-muted); display:flex; justify-content:space-between; gap:6px;}
  .campus-card .cc-bar{height:7px; border-radius:4px; background:var(--surface-2); overflow:hidden; display:flex;}
  .campus-card .cc-bar .seg{display:block;}
  .campus-card .cc-bar .seg.good{background:var(--good-pure);}
  .campus-card .cc-bar .seg.bad{background:var(--bad-pure); margin-left:1px;}
  .campus-card .cc-members{display:block; font-family:"IBM Plex Mono"; font-size:11.5px; color:var(--ink-faint);}

  /* ---------------- Organograma ---------------- */
  .org{display:flex; flex-direction:column; gap:0; margin:16px 0 8px; max-width:940px;}
  .org-node{background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); padding:14px 18px;}
  .org-node.lead{border-left:3px solid var(--accent);}
  .org-node .on-name{font-family:"Spectral", Georgia, serif; font-size:16px; font-weight:600;}
  .org-node .on-role{font-size:12px; color:var(--ink-muted); margin-top:2px;}
  .org-link{width:2px; height:18px; background:var(--border); margin-left:34px;}
  .pilares{display:grid; grid-template-columns:repeat(auto-fit, minmax(255px,1fr)); gap:12px; margin-top:4px;}
  .pilar{all:unset; cursor:pointer; box-sizing:border-box; display:flex; flex-direction:column; gap:7px; background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); padding:15px 16px; transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;}
  .pilar:hover{transform:translateY(-2px); box-shadow:var(--shadow-lift);}
  .pilar:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .pilar.active{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft), var(--shadow);}
  .pilar .pi-top{display:flex; align-items:center; gap:9px;}
  .pilar .pi-num{font-family:"IBM Plex Mono"; font-size:11px; font-weight:600; color:var(--accent-ink); background:var(--accent-soft); border-radius:6px; padding:2px 7px; flex:none;}
  .pilar .pi-name{font-family:"Spectral", Georgia, serif; font-size:15px; font-weight:600; flex:1;}
  .pilar .pi-count{font-family:"IBM Plex Mono"; font-size:11.5px; color:var(--ink-faint);}
  .pilar .pi-desc{display:block; font-size:12px; color:var(--ink-muted); line-height:1.55;}
  .pilar-detail{margin-top:14px;}
  .lateral{margin-top:22px; background:var(--clay-soft); border:1px solid var(--border); border-left:3px solid var(--clay); border-radius:12px; padding:15px 18px;}
  .lateral h4{font-size:14px; font-weight:600; color:var(--ink); margin-bottom:5px;}
  .lateral p{font-size:12.5px; color:var(--ink-muted); margin:0; line-height:1.65; max-width:72ch;}
  .flow{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:11px; font-size:12px;}
  .flow .fnode{background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:4px 12px; color:var(--ink);}
  .flow .farrow{color:var(--clay); font-family:"IBM Plex Mono";}

  /* ---------------- Trilha de formação ---------------- */
  .trilha{display:flex; align-items:stretch; gap:8px; flex-wrap:wrap; margin:14px 0 4px;}
  .trilha .step{flex:1 1 150px; min-width:0; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px 14px; box-shadow:var(--shadow); position:relative;}
  .trilha .step .sn{font-family:"IBM Plex Mono"; font-size:10.5px; color:var(--ink-faint);}
  .trilha .step .st{font-size:13px; font-weight:600; margin-top:3px;}
  .trilha .step .sd{font-size:11.5px; color:var(--ink-muted); margin-top:4px; line-height:1.5;}
  .trilha .step:last-child{border-color:var(--accent); background:var(--accent-soft);}
  .trilha .step:last-child .st{color:var(--accent-ink);}

  /* ---------------- Ministérios ---------------- */
  .min-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(255px,1fr)); gap:12px; margin:14px 0 6px;}
  .min-card{all:unset; cursor:pointer; box-sizing:border-box; background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); padding:15px 16px; display:flex; flex-direction:column; gap:8px; transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;}
  .min-card:hover{transform:translateY(-2px); box-shadow:var(--shadow-lift);}
  .min-card:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .min-card.active{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft), var(--shadow);}
  .min-card .mc-eixo{display:block; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint);}
  .min-card .mc-name{display:block; font-family:"Spectral", Georgia, serif; font-size:16px; font-weight:600;}
  .min-card .mc-pub{display:block; font-size:11.5px; color:var(--ink-muted);}
  .min-card .mc-sup{font-size:12.5px; display:flex; align-items:center; gap:6px; padding-top:8px; border-top:1px solid var(--border);}
  .min-card .mc-sup .who{color:var(--ink); font-weight:500;}
  .min-card .mc-sup .vago{color:var(--warn); font-weight:600;}
  .min-card .mc-count{display:block; font-family:"IBM Plex Mono"; font-size:11.5px; color:var(--ink-faint);}

  /* ---------------- Calendário ---------------- */
  .tl{position:relative; margin:16px 0 8px; padding-left:22px; max-width:820px;}
  .tl::before{content:''; position:absolute; left:5px; top:6px; bottom:6px; width:2px; background:var(--border);}
  .tl-item{position:relative; padding:0 0 20px 0;}
  .tl-item::before{content:''; position:absolute; left:-22px; top:5px; width:12px; height:12px; border-radius:50%; background:var(--surface); border:2px solid var(--border);}
  .tl-item.done::before{background:var(--border); border-color:var(--border);}
  .tl-item.next::before{background:var(--accent); border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft);}
  .tl-item .tl-date{font-family:"IBM Plex Mono"; font-size:11.5px; color:var(--ink-faint);}
  .tl-item.next .tl-date{color:var(--accent-ink); font-weight:600;}
  .tl-item .tl-name{font-size:14px; font-weight:600; color:var(--ink); margin-top:2px;}
  .tl-item.done .tl-name{color:var(--ink-muted); font-weight:500;}
  .tl-item .tl-meta{font-size:12px; color:var(--ink-muted); margin-top:3px; display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .tl-badge{font-size:9.5px; letter-spacing:.05em; text-transform:uppercase; font-weight:700; padding:2px 8px; border-radius:20px;}
  .tl-badge.next{background:var(--accent-soft); color:var(--accent-ink);}
  .tl-badge.done{background:var(--surface-2); color:var(--ink-faint);}
  .mes-label{font-family:"Spectral", Georgia, serif; font-size:13px; font-weight:600; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.06em; margin:4px 0 10px;}

  /* ---------------- Calendário: grade mensal interativa ---------------- */
  .legenda-cal{display:flex; flex-wrap:wrap; gap:8px 18px; font-size:11.5px; color:var(--ink-muted); margin:10px 0 16px; align-items:center;}
  .legenda-cal .k{display:flex; align-items:center; gap:6px;}
  .legenda-cal .box{width:13px; height:13px; border-radius:3px; border:1px solid var(--border); flex:none; background:var(--c);}
  .grade{background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; margin-bottom:8px;}
  .grade-bar{display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--border); background:var(--surface-2);}
  .grade-bar b{font-family:"Spectral", Georgia, serif; font-size:16px; font-weight:600; min-width:13ch;}
  .grade-bar .cont{margin-left:auto; font-family:"IBM Plex Mono", monospace; font-size:11.5px; color:var(--ink-faint);}
  .nav-m{all:unset; cursor:pointer; box-sizing:border-box; width:28px; height:28px; border-radius:8px; border:1px solid var(--border); background:var(--surface); display:flex; align-items:center; justify-content:center; font-size:15px; color:var(--ink-muted);}
  .nav-m:hover:not([disabled]){border-color:var(--accent); color:var(--accent-ink);}
  .nav-m[disabled]{opacity:.35; cursor:default;}
  .nav-m:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .grade-dias{display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); background:var(--surface-2); border-bottom:1px solid var(--border);}
  .grade-dias span{padding:7px 8px; font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-faint); font-weight:600; text-align:center;}
  .grade-cels{display:grid; grid-template-columns:repeat(7, minmax(0,1fr));}
  .cel{min-width:0; min-height:88px; border-right:1px solid var(--border); border-bottom:1px solid var(--border); padding:5px 5px 6px; display:flex; flex-direction:column; gap:3px;}
  .cel:nth-child(7n){border-right:0;}
  .cel.fora{background:var(--surface-2); opacity:.5;}
  .cel .dn{font-size:11.5px; color:var(--ink-faint); font-variant-numeric:tabular-nums;}
  .cel.tem .dn{color:var(--ink); font-weight:600;}
  .cel.clicavel{cursor:pointer;}
  .cel.clicavel:hover{background:var(--surface-2);}
  .cel.clicavel:focus-visible{outline:2px solid var(--accent); outline-offset:-2px;}
  .cel .ev{--c:var(--accent); font-size:10px; line-height:1.3; padding:2px 5px; border-radius:5px; background:color-mix(in srgb, var(--c) 16%, var(--surface)); border-left:2px solid var(--c); color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .cel .ev.meio, .cel .ev.fim{opacity:.72;}
  .grade-sem{padding:11px 16px; border-top:1px solid var(--border); display:flex; flex-wrap:wrap; gap:7px; align-items:center; background:var(--surface-2);}
  .grade-sem b{font-size:11.5px; color:var(--ink-muted); font-weight:600;}
  .grade-sem .ev{--c:var(--accent); font-size:11px; padding:3px 8px; border-radius:999px; background:color-mix(in srgb, var(--c) 16%, var(--surface)); border-left:2px solid var(--c);}
  @media (max-width: 560px){
    .cel{min-height:62px; padding:4px 3px;}
    .cel .ev{font-size:9px; padding:1px 3px;}
    .grade-bar b{min-width:0; font-size:14.5px;}
  }
  .dp-ev{border-left:3px solid var(--c, var(--accent)); background:var(--surface-2); border-radius:0 10px 10px 0; padding:11px 14px; margin-bottom:10px;}
  .dp-ev .dp-cat{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; font-weight:700;}
  .dp-ev h4{font-size:14.5px; font-weight:600; margin:3px 0 2px;}
  .dp-ev .dp-per{font-size:11.5px; color:var(--ink-faint);}
  .dp-ev .dp-obs{font-size:12.5px; color:var(--ink-muted); margin:6px 0 0; line-height:1.55;}
  .btn-g{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; padding:7px 14px; border-radius:8px; background:var(--accent); color:#fff; text-decoration:none; white-space:nowrap;}
  .btn-g:hover{background:var(--accent-ink);}
  .btn-g.ghost{background:var(--surface); color:var(--accent-ink); border:1px solid var(--border);}
  .btn-g.ghost:hover{border-color:var(--accent);}

  /* ---------------- Manual ---------------- */
  .manual-layout{display:grid; grid-template-columns:232px 1fr; gap:24px; align-items:start; margin-top:16px;}
  .manual-toc{position:sticky; top:calc(env(safe-area-inset-top, 0px) + 18px); background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); padding:12px; max-height:calc(100vh - 60px); overflow-y:auto;}
  .manual-toc .toc-label{font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint); padding:4px 8px 6px;}
  .manual-toc button{all:unset; box-sizing:border-box; cursor:pointer; display:flex; gap:8px; width:100%; padding:6px 8px; border-radius:6px; font-size:12.5px; color:var(--ink-muted); line-height:1.4;}
  .manual-toc button:hover{background:var(--surface-2); color:var(--ink);}
  .manual-toc button:focus-visible{outline:2px solid var(--accent); outline-offset:-2px;}
  .manual-toc button.active{background:var(--accent-soft); color:var(--accent-ink); font-weight:600;}
  .manual-toc button .tn{font-family:"IBM Plex Mono"; font-size:11px; color:var(--ink-faint); flex:none; width:16px;}
  .manual-toc button.active .tn{color:var(--accent-ink);}
  .manual-body{min-width:0; background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); padding:26px 30px;}
  .manual-body h3{font-family:"Spectral", Georgia, serif; font-size:21px; font-weight:600; margin-bottom:4px;}
  .manual-body .m-eyebrow{font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--accent); font-weight:600;}
  .manual-body p{font-size:13.5px; color:var(--ink-muted); line-height:1.75; margin:12px 0; max-width:68ch;}
  .manual-body p strong{color:var(--ink);}
  .manual-body ul{margin:12px 0; padding-left:20px; max-width:68ch;}
  .manual-body li{font-size:13.5px; color:var(--ink-muted); line-height:1.7; margin-bottom:6px;}
  .manual-body li strong{color:var(--ink);}
  .manual-body h4{font-size:14px; font-weight:600; margin:22px 0 2px; color:var(--ink);}
  .quote{border-left:3px solid var(--clay); background:var(--clay-soft); border-radius:0 10px 10px 0; padding:12px 16px; margin:16px 0; font-family:"Spectral", Georgia, serif; font-size:14.5px; color:var(--ink); line-height:1.65; max-width:68ch;}
  .quote .src{display:block; font-family:"Public Sans"; font-size:11.5px; color:var(--ink-muted); margin-top:6px; font-style:normal;}
  .mtable{width:100%; min-width:0; border-collapse:collapse; margin:14px 0; font-size:13px;}
  .mtable th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); padding:8px 12px; border-bottom:1px solid var(--border); font-weight:600;}
  .mtable td{padding:9px 12px; border-bottom:1px solid var(--border); color:var(--ink-muted); vertical-align:top; line-height:1.6;}
  .mtable td:first-child{color:var(--ink); font-weight:500; white-space:nowrap;}
  .mtable tr:last-child td{border-bottom:none;}
  .table-wrap{overflow-x:auto;}
  .steps{counter-reset:s; list-style:none; padding:0; margin:14px 0;}
  .steps li{counter-increment:s; position:relative; padding-left:34px; margin-bottom:11px; font-size:13.5px; color:var(--ink-muted); line-height:1.7; max-width:66ch;}
  .steps li::before{content:counter(s); position:absolute; left:0; top:1px; width:22px; height:22px; border-radius:50%; background:var(--accent-soft); color:var(--accent-ink); font-family:"IBM Plex Mono"; font-size:11px; font-weight:600; display:flex; align-items:center; justify-content:center;}
  .faq{border-top:1px solid var(--border); padding-top:14px; margin-top:6px;}
  .faq:first-of-type{border-top:none; padding-top:0;}
  .faq .q{font-size:13.5px; font-weight:600; color:var(--ink); margin-bottom:5px;}
  .faq .a{font-size:13.5px; color:var(--ink-muted); line-height:1.7; max-width:68ch;}
  .ascii{background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:14px 16px; font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:11.5px; color:var(--ink-muted); line-height:1.75; overflow-x:auto; white-space:pre; margin:14px 0;}
  .gloss{display:grid; grid-template-columns:repeat(auto-fit, minmax(230px,1fr)); gap:10px; margin:14px 0;}
  .gloss .gi{background:var(--bg); border:1px solid var(--border); border-radius:9px; padding:10px 13px;}
  .gloss .gt{font-size:12.5px; font-weight:600; color:var(--ink);}
  .gloss .gd{font-size:12px; color:var(--ink-muted); margin-top:2px; line-height:1.55;}

  /* ---------------- Saúde do cadastro ---------------- */
  .health-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(240px,1fr)); gap:12px; margin:14px 0 8px;}
  .health-card{background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); padding:14px 16px;}
  .health-card .hc-top{display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:8px;}
  .health-card .hc-name{font-size:13px; font-weight:600; color:var(--ink);}
  .health-card .hc-pct{font-family:"IBM Plex Mono"; font-size:15px; font-weight:600;}
  .health-card .hc-track{height:8px; border-radius:5px; background:var(--surface-2); overflow:hidden;}
  .health-card .hc-fill{height:100%; border-radius:5px;}
  .health-card .hc-sub{font-size:11.5px; color:var(--ink-muted); margin-top:7px;}
  .chips{display:flex; gap:7px; flex-wrap:wrap; margin:16px 0 12px;}
  .chip{all:unset; cursor:pointer; box-sizing:border-box; font-size:12px; padding:5px 12px; border-radius:20px; border:1px solid var(--border); background:var(--surface); color:var(--ink-muted);}
  .chip:hover{border-color:var(--accent); color:var(--ink);}
  .chip:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
  .chip.active{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink); font-weight:600;}
  .chip .cn{font-family:"IBM Plex Mono"; font-size:11px; opacity:.75; margin-left:5px;}

  /* ---------------- Drawer de detalhe ---------------- */
  .drawer-overlay{position:fixed; inset:0; background:var(--overlay); z-index:40; opacity:0; pointer-events:none; transition:opacity .2s ease;}
  .drawer-overlay.open{opacity:1; pointer-events:auto;}
  .drawer{
    position:fixed; top:0; right:0; height:100%; width:min(430px, 100%); z-index:41;
    background:var(--surface); border-left:1px solid var(--border); box-shadow:-18px 0 44px rgba(20,30,15,.14);
    transform:translateX(100%); transition:transform .24s cubic-bezier(.4,0,.2,1);
    display:flex; flex-direction:column; padding-top:env(safe-area-inset-top, 0px); padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  .drawer.open{transform:none;}
  @media (prefers-reduced-motion: reduce){ .drawer{transition:none;} .drawer-overlay{transition:none;} }
  .drawer-head{padding:20px 22px 14px; border-bottom:1px solid var(--border); display:flex; gap:12px; align-items:flex-start;}
  .drawer-head .dh-txt{flex:1; min-width:0;}
  .drawer-head h3{font-family:"Spectral", Georgia, serif; font-size:19px; font-weight:600; line-height:1.25;}
  .drawer-head .dh-meta{font-size:12px; color:var(--ink-muted); margin-top:5px; display:flex; gap:7px; align-items:center; flex-wrap:wrap;}
  .drawer-close{all:unset; cursor:pointer; flex:none; width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--ink-muted); background:var(--surface-2);}
  .drawer-close:hover{color:var(--ink); background:var(--border);}
  .drawer-close:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
  .drawer-body{padding:18px 22px 40px; overflow-y:auto; flex:1;}
  .dfield{padding:11px 0; border-bottom:1px solid var(--border); display:grid; grid-template-columns:106px 1fr; gap:12px; align-items:start;}
  .dfield:last-child{border-bottom:none;}
  .dfield .dk{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); padding-top:2px;}
  .dfield .dv{font-size:13px; color:var(--ink); line-height:1.6; min-width:0; overflow-wrap:anywhere;}
  .dfield .dv.empty{color:var(--ink-faint); font-style:italic;}
  .dsub{font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); margin:22px 0 4px; font-weight:600;}
  .contact-row{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border);}
  .contact-row:last-child{border-bottom:none;}
  .contact-row .cr-txt{flex:1; min-width:0;}
  .contact-row .cr-name{font-size:13px; color:var(--ink); font-weight:500;}
  .contact-row .cr-role{font-size:11.5px; color:var(--ink-muted); margin-top:1px;}
  .wa-cta{display:inline-flex; align-items:center; gap:7px; background:var(--good-soft); color:var(--good); border:1px solid transparent; border-radius:8px; padding:6px 12px; font-size:12px; font-weight:600; text-decoration:none; white-space:nowrap;}
  .wa-cta:hover{border-color:var(--good);}
  .wa-cta svg{width:13px; height:13px;}

  /* ---------------- Blocos ainda sem conteúdo ---------------- */
  .slot{background:var(--surface); border:1px dashed var(--border); border-radius:12px; padding:16px 18px;}
  .slot .slot-top{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
  .slot .slot-top svg{flex:none; color:var(--ink-faint);}
  .slot .slot-t{font-size:13.5px; font-weight:600; color:var(--ink);}
  .slot .slot-tag{margin-left:auto; font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; font-weight:700; padding:2px 8px; border-radius:20px; background:var(--warn-soft); color:var(--warn); white-space:nowrap;}
  .slot .slot-d{font-size:12.5px; color:var(--ink-muted); line-height:1.6;}

  .note{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 18px; font-size:12.5px; color:var(--ink-muted); margin-top:26px; line-height:1.7; max-width:80ch;}
  .note strong{color:var(--ink);}
  .note code{font-family:"IBM Plex Mono"; font-size:11.5px; background:var(--surface-2); padding:1px 5px; border-radius:4px;}

  @media (max-width: 980px){
    .manual-layout{grid-template-columns:1fr;}

function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
const REDUCED_MOTION = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function runCountUps(container){
  container.querySelectorAll(".count[data-target]").forEach(el=>{
    const target = Number(el.dataset.target)||0;
    if(REDUCED_MOTION){ el.textContent = target; return; }
    const duration = 700, start = performance.now();
    function tick(now){
      const t = Math.min((now-start)/duration, 1);
      el.textContent = Math.round(target*(1-Math.pow(1-t,3)));
      if(t<1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });
}
function timeKey(h){
  const m = /(\d{1,2})[:h](\d{2})?/.exec(h||"");
  if(!m) return 99*60;
  return parseInt(m[1],10)*60 + parseInt(m[2]||"0",10);
}
function isAtivo(p){ return p.s === "ativo"; }
function pgRowAttrs(p){ return `data-search="${esc((p.n+' '+p.cp+' '+(p.f||'')+' '+(p.d||'')).toLowerCase())}" data-campus="${esc(p.cp)}" data-dia="${esc(p.d)}"`; }
function diaHora(p){ return [p.d, p.h].filter(Boolean).join(" · ") || '<span class="muted">—</span>'; }

const MANUAL = [
  {
    n:1, t:"Embarque: boas-vindas e como usar", eyebrow:"Embarque",
    html:"<p>Ficamos felizes toda vez que um membro da nossa comunidade decide dar um passo além na jornada cristã e servir outras pessoas. Acreditamos que todo mundo importa e que todo mundo tem algo a compartilhar. Por isso, os PGs são mais do que reuniões: são espaços em que ficamos à vontade para conhecer mais a Deus e apresentá-lo a outras pessoas.</p>\n      <p>Você, líder, colíder ou líder em treinamento, tem um papel fundamental. Nosso objetivo é que todas as pessoas do grupo, por meio de relacionamentos saudáveis, sintam a presença de Deus, sejam cuidadas e aprendam a cuidar.</p>\n      <p>Este é um guia resumido do nosso jeito de ser e fazer pequenos grupos. Seguir cada passo garante que a experiência seja a mesma em todos os grupos, e que cada PG seja um pedacinho da Koinonia. Bem-vindo a bordo!</p>\n      <h4>Como usar este manual</h4>\n      <ul><li>Se você está <strong>começando agora</strong> (Líder em Treinamento ou Co-líder), leia na ordem as seções 1 a 8.</li><li>Se você já <strong>lidera um PG</strong>, use as seções 4, 7 a 12 e 14 como consulta.</li><li>Se você é <strong>Supervisor de PG</strong>, preste atenção especial às seções 6, 7, 10, 11 e 12.</li></ul>\n      <p>Este documento é vivo. Ele deve ser atualizado sempre que a estrutura, os papéis ou os ritmos da Área do Cuidar mudarem.</p>\n      <h4>O que dizem pessoas que atuam ou atuaram como líderes de PG na Koinonia</h4>\n      <div class=\"quote\">\"Laços reforçados e estreitados na comunhão que temos no grupo.\"</div>\n      <div class=\"quote\">\"Aprendi mais do que ensinei.\"</div>\n      <div class=\"quote\">\"Foi um ano de amadurecimento e aprendizado.\"</div>\n      <div class=\"quote\">\"Desafiador, cansativo, mas com crescimento pessoal e muito recompensador.\"</div>"

  {
    n:2, t:"Nosso DNA", eyebrow:"Identidade",
    html:"<div class=\"quote\">\"Uma igreja da cidade, para a cidade, com a cidade.\"</div>\n      <p>A Igreja Batista Koinonia (IBAK) existe para ser <strong>uma comunidade de fé onde ninguém caminha sozinho</strong>: uma igreja restauradora da esperança em Brasília, no Brasil e no mundo, que traz todas as pessoas e a pessoa toda para Cristo.</p>\n      <p>Isso não é slogan de parede. É uma decisão estrutural: se ninguém pode caminhar sozinho, a igreja precisa ser pequena o suficiente para que cada pessoa seja conhecida pelo nome. É exatamente essa a função do <strong>Pequeno Grupo (PG)</strong>.</p>\n      <h4>Cidade para cidade</h4>\n      <p>A identidade da Koinonia dialoga com o movimento global de igrejas urbanas iniciado por Tim Keller (<em>City to City</em>): igrejas que não existem para si mesmas, mas para transformar a cidade ao redor, multiplicando líderes e comunidades em vez de apenas reunir multidões. Um PG saudável carrega essa lógica em miniatura: <strong>ele não existe para se manter, existe para se multiplicar</strong>, alcançando a vizinhança, o campus, a faculdade, o condomínio onde seus membros vivem.</p>\n      <h4>A Área do Cuidar</h4>\n      <div class=\"quote\">\"Amamos a Deus e por isso cuidamos! O amor de Cristo em nós sempre se expressa em cuidado.\"</div>\n      <p>A Área do Cuidar existe para <strong>integrar, acompanhar e cuidar das pessoas</strong> por meio dos ministérios e dos PGs, fundamentada no segundo grande mandamento: \"Amar o próximo como a si mesmo\" (Marcos 12:31). Cuidar não é um departamento; é a expressão viva do evangelho.</p>\n      <p><strong>Missão da Área do Cuidar:</strong> integrar, acompanhar e cuidar das pessoas nos ministérios e PGs, cultivando uma cultura de acolhimento, suporte mútuo e discipulado intencional.</p>\n      <p><strong>Objetivo anual (2026):</strong> \"Construir uma comunidade unida no discipulado e no cuidado mútuo. Juntos somos as mãos que cuidam e o coração que ama, construindo uma comunidade que reflete o amor de Cristo.\"</p>"

  {
    n:3, t:"Fundamento bíblico", eyebrow:"Base",
    html:"<p>A palavra que dá nome à nossa igreja, <em>koinonia</em> (κοινωνία), significa comunhão, participação em comum, vida compartilhada. É o mesmo espírito de Atos 2:41-47: uma comunidade que perseverava no ensino, na comunhão, na oração e na partilha, \"de casa em casa\".</p>\n      <p>O PG é essa lógica aplicada hoje: <strong>um pedacinho da Koinonia que cabe numa sala de estar.</strong></p>\n      <div class=\"table-wrap\"><table class=\"mtable\"><thead><tr><th>Referência</th><th>O que fundamenta</th></tr></thead><tbody><tr><td>Atos 2:41-47</td><td>O modelo de igreja em casas, com ensino, comunhão, oração e cuidado prático</td></tr><tr><td>Marcos 12:31</td><td>\"Amar o próximo como a si mesmo\": o motor do Cuidar</td></tr><tr><td>Gálatas 6:2</td><td>\"Carreguem os fardos uns dos outros\": o motor do acompanhamento mútuo</td></tr><tr><td>Mateus 4:19</td><td>\"Eu te farei pescador de homens\": o chamado que sustenta todo líder</td></tr></tbody></table></div>"

  {
    n:4, t:"Propósito do PG", eyebrow:"Propósito",
    html:"<h4>O que o PG é</h4>\n      <p>Um pedacinho da Koinonia que cabe numa sala de estar. Num ambiente informal e acolhedor, colocamos em prática o que temos aprendido de Deus e fazemos diferença na vida das pessoas. Koinonia significa comunhão, parceria, uns aos outros.</p>\n      <h4>Propósito do PG</h4>\n      <p>O propósito do PG não é esse momento em si, na sala de estar — isso é só a forma que ele toma. <strong>O propósito é cuidar</strong>: não deixar ninguém de fora, de modo que cada pessoa possa ser cuidada, porque nenhuma delas é insignificante. Cada uma foi comprada pelo próprio sangue de Jesus.</p>\n      <p>É o olhar do Bom Pastor: aquele que, tendo cem ovelhas e perdendo uma, deixa as noventa e nove e vai atrás da que se perdeu, até encontrá-la (Lucas 15:4) — o mesmo cuidado que nos foi confiado para pastorear a igreja de Deus, que ele comprou com o seu próprio sangue (Atos 20:28).</p>\n      <div class=\"table-wrap\"><table class=\"mtable\"><thead><tr><th>Referência</th><th>O que fundamenta</th></tr></thead><tbody><tr><td>Lucas 15:4</td><td>O olhar do Bom Pastor — ninguém é deixado de fora</td></tr><tr><td>Atos 20:28</td><td>Cada pessoa foi comprada pelo sangue de Jesus — o motivo pastoral do cuidado</td></tr></tbody></table></div>\n      <p><strong>É esse propósito, não o formato do encontro, que sustenta a responsabilidade de quem lidera.</strong> Quem entende o PG só como \"um espaço pra fazer amizade\" não sente o peso de liderar — é só um encontro gostoso na sala de estar. Quem entende que o propósito é pastoral, que ninguém pode ficar de fora, entende que liderar um PG é um compromisso: alguém está sendo chamado a cuidar de pessoas que Jesus comprou com o seu próprio sangue. As responsabilidades da seção 7 nascem daqui.</p>\n      <h4>Um espaço para cinco coisas</h4>\n      <p>O PG é um espaço para cinco coisas:</p>\n      <div class=\"table-wrap\"><table class=\"mtable\"><thead><tr><th>Eixo</th><th>O que acontece no PG</th></tr></thead><tbody><tr><td><strong>Comunhão</strong></td><td>Promover relacionamentos saudáveis entre os membros</td></tr><tr><td><strong>Discipulado</strong></td><td>Prover cuidado pastoral aos membros da igreja e proporcionar crescimento espiritual pelo estudo da Palavra de Deus, usando os estudos direcionados pela igreja</td></tr><tr><td><strong>Serviço</strong></td><td>Inspirar pessoas ao envolvimento ativo junto à igreja local</td></tr><tr><td><strong>Evangelismo</strong></td><td>Conectar membros, pessoas não convertidas e pessoas sem igreja a Jesus e à Koinonia</td></tr><tr><td><strong>Adoração</strong></td><td>Promover uma atmosfera espiritual para que a presença de Jesus seja sentida</td></tr></tbody></table></div>\n      <h4>O que o PG não é</h4>\n      <ul><li>Grupo de oração</li><li>Grupo de estudo bíblico</li><li>Grupo de cura interior</li><li>Grupo de terapia</li><li>Ponto de pregação</li><li>Culto nos lares</li><li>Reunião social</li></ul>\n      <p>O PG também <strong>não é espaço para invasão de privacidade</strong>. O que é compartilhado no grupo fica no grupo.</p>\n      <h4>Amar, cuidar, servir e crescer</h4>\n      <p>Esta é a forma como enxergamos a jornada de todo cristão rumo à maturidade. Os quatro movimentos se sustentam uns aos outros:</p>\n      <div class=\"table-wrap\"><table class=\"mtable\"><thead><tr><th>Movimento</th><th>O que significa no PG</th></tr></thead><tbody><tr><td><strong>Amar</strong></td><td>Atmosfera espiritual e crescimento espiritual</td></tr><tr><td><strong>Cuidar</strong></td><td>Relacionamentos saudáveis e cuidado pastoral</td></tr><tr><td><strong>Servir</strong></td><td>Conectar pessoas e envolvimento ativo com a comunidade</td></tr><tr><td><strong>Crescer</strong></td><td>Conhecer e experimentar Deus</td></tr></tbody></table></div>\n      <p>Nossos PGs estão debaixo da liderança do <strong>Cuidar</strong>. Este é o nosso foco principal de atuação.</p>"
  },
  {
    n:5, t:"A jornada da pessoa", eyebrow:"Propósito",
    html:"<p>Toda pessoa que frequenta a Koinonia deveria ter duas coisas:</p>\n      <ol><li>Um <strong>ministério</strong> de pertencimento, por faixa etária ou afinidade.</li><li>Um <strong>PG</strong> de referência, onde é pessoalmente conhecida e cuidada.</li></ol>\n      <p>O caminho natural de qualquer pessoa na igreja é este:</p>\n      <ol><li><strong>Culto ou evento</strong>: o primeiro contato.</li><li><strong>Ministério</strong>: a porta de entrada, por faixa etária ou afinidade.</li><li><strong>PG</strong>: o lugar onde a pessoa é conhecida pelo nome.</li><li><strong>Cuidado real</strong>: acompanhamento, discipulado, suporte e, com o tempo, multiplicação.</li></ol>\n      <p>Quatro princípios orientam esse caminho:</p>\n      <ul><li><strong>Clareza:</strong> o caminho de qualquer pessoa passa por um PG. Não é uma opção entre várias; é o eixo central do cuidado.</li><li><strong>Movimento:</strong> o PG não é destino estático. Ele deve levar cada pessoa a crescer, servir e, eventualmente, liderar ou ajudar a abrir um novo grupo.</li><li><strong>Alinhamento:</strong> os 8 ministérios da Área do Cuidar existem para alimentar os PGs, não para competir com eles.</li><li><strong>Foco:</strong> dizemos não a estruturas paralelas e a eventos grandes que enfraquecem o cuidado individual. O cuidado acontece prioritariamente dentro dos Pequenos Grupos.</li></ul>\n      <h4>Os 8 ministérios</h4>\n      <div class=\"table-wrap\"><table class=\"mtable\"><thead><tr><th>Eixo</th><th>Ministério</th><th>Público-alvo</th></tr></thead><tbody><tr><td>Família</td><td>Experts (60+)</td><td>Melhor idade</td></tr><tr><td>Família</td><td>Mulheres</td><td>Mulheres</td></tr><tr><td>Família</td><td>Homens</td><td>Homens</td></tr><tr><td>Família</td><td>Casais</td><td>Casais</td></tr><tr><td>Novas Gerações</td><td>Kids</td><td>Crianças (0-11)</td></tr><tr><td>Novas Gerações</td><td>ID (Adolescentes)</td><td>Adolescentes (12-17)</td></tr><tr><td>Novas Gerações</td><td>KJ (Jovens)</td><td>Jovens (18-29)</td></tr><tr><td>Novas Gerações</td><td>30+ (Jovens Adultos)</td><td>Jovens adultos solteiros</td></tr></tbody></table></div>\n      <div class=\"quote\">\"O objetivo de cada ministério é o mesmo: cuidar das pessoas e levá-las ao processo de crescimento espiritual, desaguando nos Pequenos Grupos, onde o cuidado acontece.\"</div>"
  },
  {
    n:6, t:"Estrutura de liderança", eyebrow:"Estrutura",
    html:"<ul><li><strong>Coordenador do Cuidar</strong><ul><li><strong>Coordenador Geral dos PGs</strong></li><li><strong>Time Estratégico:</strong> planejamento, comunicação, dados e monitoramento, criativo e Central dos PGs</li><li><strong>Supervisores de PG</strong> (por ministério): Família (Homens, Mulheres, Casais); Novas Gerações (KJ, 30+, Adolescentes ID); Infantil (Kids); Melhor Idade (Experts 60+)</li><li><strong>Coordenadores de Campus:</strong> Areal, Peniel, Mangueiral, Guará, 35 Sul e 103 Norte</li><li><strong>Time de Suporte a Líderes:</strong> aconselhamento e treinamentos</li></ul></li></ul>\n      <h4>Os quatro pilares, em uma frase cada</h4>\n      <ol><li><strong>Time Estratégico:</strong> planeja, comunica, mede e produz para toda a operação dos PGs.</li><li><strong>Supervisores por Ministério:</strong> cuidam da saúde espiritual e relacional dos PGs do seu segmento etário.</li><li><strong>Coordenadores de Campus:</strong> articulam os PGs de um território geográfico específico.</li><li><strong>Time de Suporte a Líderes:</strong> forma, aconselha e treina quem lidera os grupos.</li></ol>\n      <h4>Como o conteúdo chega até você</h4>\n      <p>As lições usadas nos PGs nascem na <strong>Área do Crescer</strong>, na Equipe de Escritores, e chegam à Área do Cuidar por colaboração direta entre as duas áreas. Você não precisa criar conteúdo: seu papel é aplicar bem o que já foi preparado, com cuidado pastoral pela sua turma.</p>"
  },
  {
    n:7, t:"Papéis e responsabilidades", eyebrow:"Estrutura",
    html:"<p>Cada responsabilidade abaixo nasce do propósito do PG (seção 4): não deixar ninguém de fora. Não é burocracia nem protocolo — é o compromisso pastoral de quem aceita cuidar de pessoas que foram compradas pelo sangue de Jesus. Por isso o nível de responsabilidade cresce de papel para papel, do Líder em Treinamento ao Supervisor: quanto mais gente sob seu cuidado, maior o compromisso.</p>\n      <h4>Líder em Treinamento</h4>\n      <p><strong>Quem é:</strong> um membro do PG identificado com potencial de liderança, em processo intencional de formação.</p>\n      <ul><li>É discipulado diretamente pelo líder do PG.</li><li>Participa com responsabilidades crescentes: abrir a reunião, conduzir uma dinâmica, visitar um membro.</li><li>Pode estar sendo preparado para abrir um novo PG ou para substituir o líder atual no futuro.</li></ul>\n      <div class=\"quote\">No começo, não é sobre posição, é sobre disposição.</div>\n      <h4>Co-líder de PG</h4>\n      <p><strong>Quem é:</strong> parceiro do líder na condução do grupo, em posição de formação para a liderança plena.</p>\n      <ul><li>Apoia o líder na facilitação dos encontros.</li><li>Assume a condução do encontro na ausência do líder titular.</li><li>Cuida de membros específicos conforme direcionamento do líder (por exemplo, quem está afastado ou em crise).</li><li>Está em processo contínuo de formação. Não é um cargo permanente de coadjuvante; é um degrau.</li></ul>\n      <h4>Líder de PG</h4>\n      <p><strong>Quem é:</strong> o responsável por conduzir o Pequeno Grupo, promovendo comunhão, discipulado e cuidado entre os membros.</p>\n      <h4>Responsabilidades:</h4>\n      <ul><li>Facilitar os encontros com base no material produzido pela Equipe de Escritores.</li><li>Participar das reuniões de supervisão, treinamento e alinhamento dos PGs.</li><li>Selecionar e treinar um co-líder.</li><li>Cuidar pastoralmente dos membros do grupo: ligar, visitar, orar e acompanhar.</li><li>Formar e desenvolver seu co-líder e seus líderes em treinamento. Um líder saudável está sempre formando quem vem depois dele.</li><li>Conduzir o PG dentro do planejamento da Área do Cuidar.</li><li>Manter o cadastro do grupo atualizado: membros, frequência e última visita.</li><li>Ser dizimista.</li><li>Participar dos eventos do Cuidar e da EBD.</li><li>Reportar-se ao Supervisor do seu ministério.</li></ul>\n      <p><strong>Papel, em resumo:</strong> conectar pessoas, promover relacionamentos e oferecer apoio. Inspirar pelo exemplo a amar e servir na igreja local e ser relevante na sociedade.</p>\n      <h4>As quatro marcas de um bom líder de PG</h4>\n      <div class=\"table-wrap\"><table class=\"mtable\"><thead><tr><th>Marca</th><th>O que significa</th></tr></thead><tbody><tr><td><strong>Exemplo</strong></td><td>A palavra convence, o exemplo arrasta. O líder vive primeiro o que ensina.</td></tr><tr><td><strong>Serviço</strong></td><td>Quem não serve não lidera de verdade.</td></tr><tr><td><strong>Visão</strong></td><td>Enxerga potencial nas pessoas antes que elas mesmas enxerguem.</td></tr><tr><td><strong>Influência</strong></td><td>Inspira, não impõe.</td></tr></tbody></table></div>\n      <h4>Requisitos práticos</h4>\n      <ul><li>Ser comprometido com a visão da igreja e do Cuidar.</li><li>Ser proativo no servir: não espera ser convocado para resolver o que vê.</li><li>Ser intencional: cada encontro, conversa e ação tem um propósito ligado a levar pessoas a Jesus.</li><li>Estar preparado para responder às demandas do seu público (estudar e entender o universo da sua faixa etária).</li></ul>\n      <h4>Supervisor de PG</h4>\n      <p><strong>Quem é:</strong> o líder do ministério ou faixa etária da Koinonia, responsável por supervisionar todos os PGs daquele segmento.</p>\n      <h4>Responsabilidades:</h4>\n      <ul><li>Participar das reuniões de coordenação, treinamento e alinhamento dos PGs.</li><li>Acompanhar o desenvolvimento dos líderes sob sua supervisão.</li><li>Conectar os líderes de PG por meio de relacionamentos saudáveis e equipá-los com ferramentas de liderança e maturidade espiritual.</li><li>Monitorar o andamento dos grupos: não só números, mas pessoas.</li><li>Articular a identidade do ministério com a dinâmica dos PGs.</li><li>Identificar, desenvolver e apoiar novos líderes dentro do seu ministério.</li><li>Ser dizimista.</li><li>Participar dos eventos do Cuidar e da EBD.</li><li>Reportar-se ao Coordenador Geral dos PGs.</li></ul>\n      <h4>Acima do Supervisor</h4>\n      <ul><li><strong>Coordenador de Campus:</strong> responsável pelos PGs de um território (Areal, Peniel, Mangueiral, Guará, 35 Sul, 103 Norte). Articula os líderes da região e leva ao Supervisor as demandas que precisam dele.</li><li><strong>Coordenador Geral dos PGs</strong>: autoridade direta sobre os quatro pilares.</li><li><strong>Coordenador do Cuidar</strong>: responde pela Área do Cuidar como um todo.</li></ul>"

  {
    n:8, t:"A reunião", eyebrow:"Reunião",
    html:"<h4>Formato e duração</h4>\n      <ul><li><strong>Frequência:</strong> semanal.</li><li><strong>Duração:</strong> em torno de 1h30. Essa previsibilidade ajuda os convidados, facilita a vida do anfitrião e ajuda no planejamento semanal (pontualidade).</li><li><strong>Formato:</strong> presencial, preferencialmente nas casas (Romanos 16:1-5, 23-24). Em acordo, pode haver casas reserva. Alguns grupos de adolescentes se reúnem em espaço próprio.</li><li><strong>Anfitrião:</strong> receber na casa não obriga o anfitrião a oferecer lanche. O lanche é um momento do grupo, não uma obrigação de quem recebe.</li><li><strong>Quem quiser ficar mais tempo</strong> é bem-vindo, com o ok do anfitrião. Mas o líder tem a obrigação de dizer que a reunião acabou.</li></ul>\n      <h4>Roteiro do encontro</h4>\n      <div class=\"table-wrap\"><table class=\"mtable\"><thead><tr><th>Tempo</th><th>Atividade</th><th>Propósito</th></tr></thead><tbody><tr><td>45 min</td><td>Louvor, quebra-gelo e estudo (guia disponibilizado pela igreja)</td><td>Proporcionar ferramentas para o crescimento espiritual</td></tr><tr><td>15 min</td><td>Oração e agenda da igreja</td><td>Encorajar o envolvimento com a igreja</td></tr><tr><td>30 min</td><td>Lanche e convite para a próxima reunião</td><td>Promover relacionamento</td></tr></tbody></table></div>\n      <p>A acolhida acontece na chegada, antes do louvor. O compartilhamento de vida e a oração pelos membros (Gálatas 6:2) acontecem no bloco de oração ou durante o lanche, conforme o perfil de cada grupo.</p>\n      <h4>O PG tem de ser legal</h4>\n      <p>Servimos a um Deus alegre, e a alegria é uma das evidências do controle do Espírito Santo (Gálatas 5:22; Atos 14:17). Por isso, a reunião tem quatro momentos que se misturam:</p>\n      <ul><li><strong>Informalidade:</strong> o grupo é simples como uma reunião de amigos. A cada semana, a gente aprende, ensina, conversa, é cuidado, cuida, conhece gente nova, faz um lanchinho e, na soma dos fatores, se desenvolve na fé.</li><li><strong>Fé:</strong> o momento de ouvir a Palavra e orar.</li><li><strong>Amor:</strong> o momento de cuidar uns dos outros.</li><li><strong>Alegria:</strong> o clima que mostra que o Espírito está agindo (Atos 2:28, 42-47).</li></ul>\n      <h4>Princípios para a condução</h4>\n      <ul><li>Cada grupo desenvolve sua própria personalidade dentro dessa estrutura. Não force uniformidade artificial: um PG de casais e um PG de KJ não precisam soar iguais.</li><li>O objetivo do encontro nunca é \"cumprir a lição\". É fazer discípulos. Se uma conversa de cuidado tomar mais tempo que o estudo, tudo bem.</li><li>Convide sempre à participação. Ninguém deveria sair de um PG tendo apenas ouvido.</li><li>Cuide do ambiente: convite, preparação, louvor e participação são parte da reunião.</li></ul>"

  {
    n:9, t:"Compartilhando a Palavra", eyebrow:"Reunião",

eunião de líderes: conforme o calendário da Área do Cuidar.</li></ul>\n      <div class=\"quote\">O princípio que guia tudo isso: garantir que 100% dos frequentadores da igreja estejam conectados a um PG ou ministério, e que ninguém em situação de vulnerabilidade passe despercebido.</div>"

  {
    n:11, t:"Formação e multiplicação", eyebrow:"Formação",
    html:"<h4>A trilha de crescimento</h4>\n      <p>Um PG saudável nunca para de formar gente. A trilha natural de um líder é:</p>\n      <ol><li>Membro do PG</li><li>Líder em treinamento</li><li>Co-líder</li><li>Líder de PG</li><li>Líder multiplicador: abre um novo PG ou torna-se Supervisor</li></ol>\n      <p><strong>Pré-requisito de todo novo líder é ser discípulo.</strong> Na prática, essa pessoa reflete isso sendo assídua, participativa, ensinável, aberta ao discipulado e aprovada pela liderança.</p>\n      <p>Todo líder de PG deve ter, sempre que possível, um co-líder e um líder em treinamento ao seu lado. Isso não é burocracia: é o modelo de multiplicação. Ninguém lidera sozinho para sempre, e ninguém deveria continuar sozinho quando o grupo cresce.</p>\n      <h4>Treinar é ver, ajudar, fazer e dar feedback</h4>\n      <p>Formar líderes começa dentro do próprio PG, na convivência semanal. O modelo é simples: primeiro você vê o líder fazer, depois ajuda, depois o novo líder faz e, por fim, recebe feedback.</p>\n      <h4>Quando multiplicar</h4>\n      <ul><li>Um grupo com frequência consolidada de <strong>12 pessoas ou 8 casais</strong> está pronto para multiplicar.</li><li>Multiplicar (e não dividir) é um objetivo, não uma obsessão.</li><li>Grupos que crescem e não multiplicam, morrem. Cada PG deve ser uma incubadora de novos líderes.</li><li>O co-líder ou o líder em treinamento assume a nova liderança ao abrir o novo grupo, ao lado do mentor.</li></ul>\n      <h4>Por que isso importa</h4>\n      <p>Discípulos geram discípulos (Atos 1:8; 1 Timóteo 2:3-6). A expansão do Reino é uma missão da Igreja. Igrejas de qualidade crescem, e vidas transformadas por Jesus devem ser um sonho de todo PG.</p>\n      <div class=\"quote\">\"O verdadeiro líder não cria seguidores, cria novos líderes.\"</div>\n      <div class=\"quote\">\"Se cada líder cuidar bem de algumas pessoas, toda a igreja será alcançada.\"</div>"

  {
    n:12, t:"Ciclo de vida do PG", eyebrow:"Ciclo de vida",

  {
    n:14, t:"Dicas de ouro e cultura de equipe", eyebrow:"Cultura",
    html:"<h4>Dicas de ouro</h4>\n      <ul><li><strong>A oração é a chave do sucesso.</strong></li><li><strong>Não centralize.</strong> Divida tarefas e formação. Um grupo que depende de uma pessoa para tudo não sobrevive a ela.</li><li><strong>Cuide das reuniões:</strong> convite, preparação, louvor, ambiente e participação.</li><li><strong>Pastoreie seu PG:</strong> conheça, ore, visite, valorize e reporte dificuldades.</li><li><strong>Integre novos membros com uma conversa.</strong></li><li><strong>Não se intimide.</strong> Você não precisa ter todas as respostas.</li><li><strong>Preste contas</strong> ao seu Supervisor.</li><li><strong>Invista em relacionamentos.</strong></li><li><strong>Celebre novos membros.</strong></li><li><strong>Não desista de ninguém.</strong></li><li><strong>Disciplina no grupo deve ser direta, com testemunha.</strong></li></ul>\n      <h4>Cultura de uma equipe saudável</h4>\n      <p>Um PG é tão saudável quanto a equipe de liderança que o sustenta. Cinco dimensões ajudam a equipe a ficar equilibrada:</p>\n      <div class=\"table-wrap\"><table class=\"mtable\"><thead><tr><th>Dimensão</th><th>Na prática</th></tr></thead><tbody><tr><td><strong>Administrativa</strong></td><td>Organizar datas, cadastro e responsabilidades com excelência. Organização não sufoca o Espírito; cria espaço para Ele agir.</td></tr><tr><td><strong>Espiritual</strong></td><td>Nenhuma estratégia substitui a oração. A equipe ora junta, pelos membros, pelo grupo e uns pelos outros.</td></tr><tr><td><strong>Motivacional</strong></td><td>Relembrar com frequência o porquê de liderar. Celebrar pequenas vitórias e reacender o propósito.</td></tr><tr><td><strong>Relacional</strong></td><td>A equipe é feita de amigos em Cristo, não só colegas de função. Resolve conflitos com maturidade, sem fofoca.</td></tr><tr><td><strong>Aprendizagem</strong></td><td>Depois de cada encontro ou fase, perguntar: o que deu certo? o que pode melhorar? o que Deus ensinou?</td></tr></tbody></table></div>\n      <p><strong>Cultura de honra:</strong> honramos publicamente e corrigimos em particular. Falamos bem uns dos outros, celebramos os dons de quem está ao nosso lado e servimos sem competição.</p>"

/* ───────────────────────── Agregados ───────────────────────── */
const ATIVOS = PGS.filter(isAtivo);
const NAO_ATIVOS = PGS.filter(p => !isAtivo(p));
const TOTAL = PGS.length;
const MEMBROS_ATIVOS = ATIVOS.reduce((s,p)=>s+p.m,0);
const MEMBROS_NAO_ATIVOS = NAO_ATIVOS.reduce((s,p)=>s+p.m,0);
const MEDIA_MEMBROS = ATIVOS.length ? MEMBROS_ATIVOS / ATIVOS.length : 0;

const campusAgg = {};
PGS.forEach(p=>{
  const k = p.cp || "Sem campus";
  if(!campusAgg[k]) campusAgg[k] = {total:0, ativo:0, nao:0, membros:0};
  campusAgg[k].total++;
  if(isAtivo(p)){ campusAgg[k].ativo++; campusAgg[k].membros += p.m; } else campusAgg[k].nao++;
});
const CAMPI = Object.keys(campusAgg);
const CAMPI_COM_ATIVO = CAMPI.filter(c=>campusAgg[c].ativo>0).length;

const dayAgg = {};
ATIVOS.forEach(p=>{ const k = p.d || ""; dayAgg[k] = (dayAgg[k]||0)+1; });

/* ───────────────────────── Navegação ───────────────────────── */
const NAV = [
  {grupo:"Panorama"},
  {id:"geral", label:"Visão Geral", icon:"overview"},
  {id:"semana", label:"Agenda da Semana", icon:"week", pill:ATIVOS.length-(dayAgg[""]||0)},
  {grupo:"Grupos"},
  {id:"ativos", label:"PGs Ativos", icon:"check", pill:ATIVOS.length},
  {id:"nao-ativos", label:"PGs Não Ativos", icon:"x", pill:NAO_ATIVOS.length},
  {id:"campus", label:"Por Campus", icon:"map", pill:CAMPI.length},
  {grupo:"Estrutura"},
  {id:"organograma", label:"Organograma", icon:"org"},
  {id:"calendario", label:"Calendário", icon:"cal", pill:EVENTOS.length+CAL2027.length},
  {id:"treinamento", label:"Treinamentos", icon:"grad"},
  {id:"manual", label:"Manual dos PGs", icon:"book"}
];

function renderNav(active){
  const nav = document.getElementById("nav");
  nav.innerHTML = NAV.map(n=> n.grupo
      ? `<div class="nav-label">${esc(n.grupo)}</div>`
      : `<button class="nav-btn ${n.id===active?'active':''}" data-nav="${n.id}">${ICONS[n.icon]}<span class="lbl">${esc(n.label)}</span>${n.pill!=null?`<span class="pill">${n.pill}</span>`:''}</button>`
    ).join("");
  nav.querySelectorAll("[data-nav]").forEach(btn=>btn.addEventListener("click", ()=>showSection(btn.dataset.nav)));
}
function showSection(id){
  renderNav(id);
  document.querySelectorAll(".section").forEach(s=>s.classList.toggle("active", s.id==="sec-"+id));
  document.querySelector("main").scrollTo?.({top:0, behavior: REDUCED_MOTION?"auto":"smooth"});
}

/* ───────────────────────── Busca rápida ───────────────────────── */
function renderQuickSearch(){
  const input = document.getElementById("quickSearch");
  const results = document.getElementById("quickResults");
  input.addEventListener("input", ()=>{
    const q = input.value.trim().toLowerCase();
    if(q.length<2){ results.classList.remove("show"); results.innerHTML=""; return; }
    const matches = PGS.filter(p => (p.n+' '+p.cp).toLowerCase().includes(q)).slice(0,9);
    results.innerHTML = matches.length ? matches.map(p=>`<button data-campus="${esc(p.cp)}">${esc(p.n)}<span class="r-sub">${esc(p.cp)} · ${isAtivo(p)?'ativo':'não-ativo'}</span></button>`).join("")
      : '<div class="no-res">Nenhum PG encontrado.</div>';
    results.classList.add("show");
    results.querySelectorAll("button[data-campus]").forEach(b=>b.addEventListener("click", ()=>{
      showSection("campus"); renderCampusTable(b.dataset.campus); results.classList.remove("show"); input.value="";
    }));
  });
  document.addEventListener("click", e=>{ if(!e.target.closest(".side-search")) results.classList.remove("show"); });
}

/* ───────────────────────── Visão Geral ───────────────────────── */
function renderDonut(){
  const r = 60, c = 2*Math.PI*r;
  const frac = TOTAL ? ATIVOS.length/TOTAL : 0;
  const ativoLen = c*frac;
  const pct = Math.round(frac*100);
  return `
    <div class="donut-card">
      <div class="donut-title">Status dos PGs</div>
      <div class="donut-figure">
        <svg width="150" height="150" viewBox="0 0 150 150" role="img" aria-label="${pct}% dos PGs estão ativos">
          <circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--bad)" stroke-width="16"/>
          <circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--good)" stroke-width="16"
            stroke-dasharray="${ativoLen} ${c-ativoLen}" stroke-linecap="round" transform="rotate(-90 75 75)"/>
        </svg>
        <div class="donut-center"><div class="big"><span class="count" data-target="${pct}">0</span>%</div><div class="lbl">ativos</div></div>
      </div>
      <div class="donut-legend">
        <div class="li"><span class="sw" style="background:var(--good)"></span>Ativos <b><span class="count" data-target="${ATIVOS.length}">0</span></b></div>
        <div class="li"><span class="sw" style="background:var(--bad)"></span>Não-ativos <b><span class="count" data-target="${NAO_ATIVOS.length}">0</span></b></div>
      </div>
    </div>`;
}

function renderGeral(){
  const maxCampus = Math.max(...CAMPI.map(c=>campusAgg[c].total));
  const campusRows = [...CAMPI].sort((a,b)=>campusAgg[b].total-campusAgg[a].total).map(c=>{
    const a = campusAgg[c];
    return `<div class="bar-rank-row">
      <div class="cat-name">${esc(c)}</div>
      <div class="bar-track"><div class="bar-fill good" style="width:${Math.round(a.ativo/maxCampus*100)}%"></div><div class="bar-fill bad" style="width:${Math.round(a.nao/maxCampus*100)}%"></div></div>
      <div class="bar-amt">${a.total}<span class="sub">${a.membros} membros</span></div>
    </div>`;

}

let ativosSort = {key:null, dir:1};
function sortAtivos(list){
  if(!ativosSort.key) return list;
  const k = ativosSort.key, dir = ativosSort.dir;
  return [...list].sort((a,b)=>{
    const va = a[k], vb = b[k];
    if(typeof va === "number") return (va-vb)*dir;
    return String(va||"").localeCompare(String(vb||""),'pt')*dir;
  });
}
function filtrarLinhas(bodyId, q, campus, dia){
  document.querySelectorAll(`#${bodyId} tr`).forEach(tr=>{
    const ok = (!q || tr.dataset.search.includes(q)) && (!campus || tr.dataset.campus===campus) && (!dia || tr.dataset.dia===dia);
    tr.style.display = ok ? "" : "none";
  });
}
