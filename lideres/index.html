/* ───────────────────────── Calendário ───────────────────────── */
/* ── Grade mensal interativa de 2027 ──────────────────────────────────── */
const DIAS_SEM = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
let gradeMes = 0;
const GRADE_ANO = 2027;

function eventosDoDia(mes, dia){
  return CAL2027.filter(e=>{
    if(e.m!==mes+1 || e.risc || !e.d) return false;
    return e.ate ? (dia>=e.d && dia<=e.ate) : dia===e.d;
  });
}

function pintarGrade(){
  const alvo = document.getElementById("grade");
  if(!alvo) return;
  const mes = gradeMes;
  const primeiro = new Date(GRADE_ANO, mes, 1).getDay();
  const nDias = new Date(GRADE_ANO, mes+1, 0).getDate();
  const semDia = CAL2027.filter(e=>e.m===mes+1 && !e.d && !e.risc);

  const celulas = [];
  for(let i=0;i<primeiro;i++) celulas.push(`<div class="cel fora"></div>`);
  for(let dia=1; dia<=nDias; dia++){
    const evs = eventosDoDia(mes, dia);
    celulas.push(`<div class="cel ${evs.length?"tem clicavel":""}"
      ${evs.length?`role="button" tabindex="0" data-dia="${dia}" aria-label="${dia} de ${MESES27[mes]}: ${evs.length} evento${evs.length>1?"s":""}"`:""}>
      <span class="dn mono">${dia}</span>
      ${evs.map(e=>{
        const tp = TIPO_CAL[e.t]||TIPO_CAL.data;
        const faixa = e.ate ? (dia===e.d?"ini":dia===e.ate?"fim":"meio") : "";
        return `<span class="ev ${faixa}" style="--c:${tp.cor}" title="${esc(e.ev)}${e.obs?" — "+esc(e.obs):""}">${esc(e.ev)}</span>`;
      }).join("")}
    </div>`);
  }
  while(celulas.length % 7) celulas.push(`<div class="cel fora"></div>`);

  alvo.innerHTML = `
    <div class="grade-bar">
      <button type="button" class="nav-m" id="mPrev" aria-label="Mês anterior" ${mes===0?"disabled":""}>‹</button>
      <b>${esc(MESES27[mes][0].toUpperCase()+MESES27[mes].slice(1))} de ${GRADE_ANO}</b>
      <button type="button" class="nav-m" id="mNext" aria-label="Próximo mês" ${mes===11?"disabled":""}>›</button>
      <span class="cont">${CAL2027.filter(e=>e.m===mes+1 && !e.risc).length} eventos</span>
    </div>
    <div class="grade-dias">${DIAS_SEM.map(d=>`<span>${d}</span>`).join("")}</div>
    <div class="grade-cels">${celulas.join("")}</div>
    ${semDia.length ? `<div class="grade-sem">
      <b>No mês, sem dia definido:</b>
      ${semDia.map(e=>{
        const tp = TIPO_CAL[e.t]||TIPO_CAL.data;
        return `<span class="ev" style="--c:${tp.cor}">${esc(e.ev)}</span>`;
      }).join("")}
    </div>` : ""}`;

  const prev = document.getElementById("mPrev"), next = document.getElementById("mNext");
  if(prev) prev.onclick = ()=>{ if(gradeMes>0){ gradeMes--; pintarGrade(); } };
  if(next) next.onclick = ()=>{ if(gradeMes<11){ gradeMes++; pintarGrade(); } };

  alvo.querySelectorAll(".cel.clicavel").forEach(c=>{
    const abrir = ()=>abrirDiaCalendario(gradeMes, Number(c.dataset.dia));
    c.onclick = abrir;
    c.onkeydown = e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); abrir(); } };
  });
}

/* Painel do dia — reaproveita o mesmo drawer dos cards de PG (#drawer). */
function abrirDiaCalendario(mes, dia){
  const evs = eventosDoDia(mes, dia);
  if(!evs.length) return;
  lastFocus = document.activeElement;
  const data = new Date(GRADE_ANO, mes, dia);
  const diaSemana = ["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"][data.getDay()];
  const linkDia = `https://calendar.google.com/calendar/u/0/r/day/${GRADE_ANO}/${mes+1}/${dia}`;

  document.getElementById("drawerTitle").textContent = `${dia}/${String(mes+1).padStart(2,"0")}/${GRADE_ANO}`;
  document.getElementById("drawerMeta").innerHTML = `<span>${esc(diaSemana)}</span>`;
  document.getElementById("drawerBody").innerHTML = evs.map(e=>{
    const tp = TIPO_CAL[e.t]||TIPO_CAL.data;
    const periodo = e.ate ? `${e.d} a ${e.ate} de ${MESES27[mes]}` : `${e.d} de ${MESES27[mes]}`;
    return `<article class="dp-ev" style="--c:${tp.cor}">
      <span class="dp-cat" style="color:${tp.cor}">${esc(tp.lbl)}</span>
      <h4>${esc(e.ev)}</h4>
      <div class="dp-per mono">${esc(periodo)}${e.ate?` · ${e.ate-e.d+1} dias`:""}</div>
      ${e.obs?`<p class="dp-obs">${esc(e.obs)}</p>`:""}
    </article>`;
  }).join("") + `<a class="btn-g" style="margin-top:6px" href="${linkDia}" target="_blank" rel="noopener">Abrir este dia no Google Agenda ↗</a>`;

  const d = document.getElementById("drawer");
  d.classList.add("open"); d.setAttribute("aria-hidden","false");
  document.getElementById("drawerOverlay").classList.add("open");
  document.getElementById("drawerClose").focus();
}

function renderCalendario(){
  const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  let mesAtual = "";
  const itens = EVENTOS.map(e=>{
    const dt = new Date(e.iso+"T12:00:00");
    const passado = dt < HOJE;
    const isNext = PROX_EVENTO && e.iso===PROX_EVENTO.iso && e.nome===PROX_EVENTO.nome;
    const mes = MESES[dt.getMonth()];
    const header = mes!==mesAtual ? (mesAtual=mes, `<div class="mes-label">${mes} de 2026</div>`) : "";
    return header + `
      <div class="tl-item ${isNext?'next':(passado?'done':'')}">
        <div class="tl-date">${esc(e.quando)}</div>
        <div class="tl-name">${esc(e.nome)}</div>
        <div class="tl-meta"><span>${esc(e.escopo)}</span>${isNext?'<span class="tl-badge next">Próximo</span>':(passado?'<span class="tl-badge done">Realizado</span>':'')}</div>
      </div>`;
  }).join("");

  const legenda = `<div class="legenda-cal">` + Object.values(TIPO_CAL).map(v=>
    `<span class="k"><span class="box" style="--c:${v.cor}"></span> ${esc(v.lbl)}</span>`
  ).join("") + `</div>`;

  document.getElementById("sec-calendario").innerHTML = `
    <div class="section-head">
      <div class="eyebrow">Estrutura · Calendário de Eventos</div>
      <h2>Calendário</h2>
      <p class="section-sub">Marcos da Área do Cuidar em 2026 e o calendário de atividades de 2027, já lançado na agenda oficial. ${PROX_EVENTO?`O próximo marco de 2026 é <strong>${esc(PROX_EVENTO.nome)}</strong>, em ${esc(PROX_EVENTO.quando)}.`:'Todos os eventos de 2026 já aconteceram — 2027 vem a seguir.'}</p>
    </div>

    <div class="note" style="margin-top:0">
      <strong>Agenda oficial:</strong> ${esc(GCAL_NOME)} é onde os eventos são marcados, movidos e apagados de verdade — o que está abaixo é um retrato dela.
      <div style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap">
        <a class="chip" href="${GCAL_ABRIR}" target="_blank" rel="noopener">Abrir no Google Agenda ↗</a>
        <a class="chip" href="${GCAL_ADD}" target="_blank" rel="noopener">Adicionar à minha agenda</a>
      </div>
    </div>

    <h3 class="block-title" style="margin-top:0">2027 mês a mês</h3>
    <p class="block-sub">Os mesmos eventos que estão na agenda oficial. Toque num dia com marcação para ver o que acontece nele.</p>
    ${legenda}
    <div class="grade" id="grade"></div>
    <p class="note">O ano foi deduzido das datas móveis anotadas no quadro da coordenação: Carnaval 5–10/02, Páscoa 26–28/03, Dia das Mães 09/05 e Dia dos Pais 08/08 só coincidem em 2027.</p>

    <h3 class="block-title">2026 · Marcos da área</h3>
    <div class="tl">${itens}</div>

    <h3 class="block-title">Ritmos recorrentes</h3>
    <p class="block-sub">Os ciclos fixos que sustentam o acompanhamento, independentemente das datas do ano.</p>
    <div class="table-card">
      <div class="table-scroll">
        <table>
          <thead><tr><th>Evento</th><th>Frequência</th><th>Para quem</th></tr></thead>
          <tbody>${RECORRENTES.map(r=>`<tr><td class="name">${esc(r[0])}</td><td>${esc(r[1])}</td><td class="tags">${esc(r[2])}</td></tr>`).join("")}</tbody>
        </table>
      </div>
    </div>`;

  pintarGrade();
}

/* ───────────────────────── Treinamentos ───────────────────────── */
function renderTreinamento(){
  const TREINOS = EVENTOS.filter(e => /treinamento/i.test(e.nome));
  const futuros = TREINOS.filter(e => new Date(e.iso+"T12:00:00") >= HOJE);
  const linhaTreino = TREINOS.map(e=>{
    const passado = new Date(e.iso+"T12:00:00") < HOJE;
    return `<div class="tl-item ${passado?'done':'next'}">
      <div class="tl-date">${esc(e.quando)}</div>
      <div class="tl-name">${esc(e.nome)}</div>
      <div class="tl-meta"><span>${esc(e.escopo)}</span>${passado?'<span class="tl-badge done">Realizado</span>':'<span class="tl-badge next">A realizar</span>'}</div>
    </div>`;
  }).join("");
  const slot = (t,d) => `<div class="slot"><div class="slot-top">${ICONS.grad}<span class="slot-t">${esc(t)}</span><span class="slot-tag">a preencher</span></div><div class="slot-d">${d}</div></div>`;

  document.getElementById("sec-treinamento").innerHTML = `
    <div class="section-head">
      <div class="eyebrow">Estrutura · Treinamentos</div>
      <h2>Treinamentos</h2>
      <p class="section-sub">Ninguém assume um PG sozinho e no escuro. Esta aba reúne o que um líder precisa saber antes de conduzir um grupo, o que se espera dele depois, e quando acontecem os encontros de formação da área.</p>
    </div>

    <h3 class="block-title">Por que existe um treinamento</h3>
    <p class="block-sub" style="max-width:74ch;">
      Um PG não se sustenta por carisma. Ele se sustenta por preparo — alguém que sabe conduzir uma conversa, perceber quem está se afastando, lidar com conflito sem quebrar o vínculo e apontar para Cristo sem soar ensaiado. O treinamento existe para que a liderança seja uma <strong>competência formada</strong>, não um dom presumido, e para que todo PG da Koinonia ofereça o mesmo cuidado, independentemente de quem o lidera ou de qual campus ele é.
    </p>
    <p class="block-sub" style="max-width:74ch;">Hoje a área tem <strong>${ATIVOS.length} PGs ativos</strong>. Formar a liderança de cada um é o que permite que os grupos se multipliquem sem perder o padrão de cuidado.</p>

    <h3 class="block-title">Encontros de formação em 2026</h3>
    <p class="block-sub">Puxados do Calendário de Eventos — ${futuros.length ? `${futuros.length} ainda por acontecer.` : 'todos já aconteceram.'}</p>
    <div class="tl">${linhaTreino || '<p class="block-sub">Nenhum treinamento no calendário.</p>'}</div>

    <h3 class="block-title">Trilha de formação</h3>
    <p class="block-sub">O caminho que uma pessoa percorre dentro do PG até formar quem vem depois.</p>
    <div class="trilha">
      <div class="step"><div class="sn">Ponto de partida</div><div class="st">Membro do PG</div><div class="sd">Participa, é conhecido pelo nome e cuidado.</div></div>
      <div class="step"><div class="sn">Formação</div><div class="st">Líder em Treinamento</div><div class="sd">Assume responsabilidades crescentes sob discipulado.</div></div>
      <div class="step"><div class="sn">Corresponsável</div><div class="st">Co-líder</div><div class="sd">Conduz na ausência do titular e cuida de membros específicos.</div></div>
      <div class="step"><div class="sn">Titular</div><div class="st">Líder de PG</div><div class="sd">Conduz o grupo e forma quem vem depois.</div></div>
      <div class="step"><div class="sn">Fruto</div><div class="st">Líder multiplicador</div><div class="sd">Abre um novo PG ou torna-se Supervisor.</div></div>
    </div>

    <h3 class="block-title">O que ainda entra aqui</h3>
    <p class="block-sub">Espaços reservados para o conteúdo do treinamento. Enquanto não chegam, ficam marcados para não passarem por esquecimento.</p>
    <div class="attn-grid">
      ${slot("Módulos do treinamento", "Os blocos de conteúdo, na ordem em que são dados — cada um com objetivo, duração e a quem se destina.")}
      ${slot("Materiais de apoio", "Apostila, slides, roteiros de estudo e o que mais o líder leva para casa.")}
      ${slot("Quem deve participar", "Critérios de quem é convocado a cada turma: líderes novos, co-líderes, líderes em treinamento, supervisores.")}
      ${slot("Avaliação e acompanhamento", "Como se verifica que a formação pegou — e o que acontece depois do encontro.")}
    </div>`;
}

let manualAtivo = 1;
function renderManualBody(rolar=false){
  const s = MANUAL.find(x=>x.n===manualAtivo);
  document.getElementById("manualBody").innerHTML = `
    <div class="m-eyebrow">Seção ${s.n} · ${esc(s.eyebrow)}</div>
    <h3>${esc(s.t)}</h3>
    ${s.html}`;
  document.querySelectorAll("#manualToc button").forEach(b=>b.classList.toggle("active", Number(b.dataset.s)===manualAtivo));
  if(rolar) document.getElementById("manualBody").scrollIntoView?.({behavior: REDUCED_MOTION?"auto":"smooth", block:"nearest"});
}
function renderManual(){
  document.getElementById("sec-manual").innerHTML = `
    <div class="section-head">
      <div class="eyebrow">Estrutura · Manual dos PGs</div>
      <h2>Manual dos PGs</h2>
      <p class="section-sub">Referência para Líderes, Co-líderes, Líderes em Treinamento e Supervisores. Se você está <strong>começando agora</strong>, leia as seções 1 a 8 na ordem. Se já <strong>lidera um PG</strong>, use as seções 4, 7 a 12 e 14 como consulta. Se é <strong>Supervisor</strong>, as seções 6, 7, 10, 11 e 12 sustentam a saúde dos grupos do seu ministério.</p>
    </div>
    <div class="manual-layout">
      <nav class="manual-toc" id="manualToc" aria-label="Seções do manual">
        <div class="toc-label">Seções</div>
        ${MANUAL.map(s=>`<button data-s="${s.n}" class="${s.n===manualAtivo?'active':''}"><span class="tn">${s.n}</span><span>${esc(s.t)}</span></button>`).join("")}
      </nav>
      <article class="manual-body" id="manualBody"></article>
    </div>`;
  document.querySelectorAll("#manualToc button").forEach(b=>{
    b.addEventListener("click", ()=>{ manualAtivo = Number(b.dataset.s); renderManualBody(true); });

}
