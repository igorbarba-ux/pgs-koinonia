<title>Encontre seu PG</title>
<link rel="manifest" href="manifest-match.json">
<meta name="theme-color" content="#AD1E2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Encontre PG">
<link rel="apple-touch-icon" href="icon-match-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-match-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
  /* ── Tokens ─────────────────────────────────────────────────────────
     Paleta oficial da Batista Koinonia: vinho #AD1E2E (ação), creme
     #F4EEDC (fundo), texto #241F1B, cinza #595959 e a roda das quatro
     áreas (âmbar, coral, verde-água, malva). As cores da roda entram
     puras (--*-pure) só em preenchimentos; texto usa a variante escura. */
  :root{
    --bg:#F4EEDC; --surface:#FFFFFF; --surface-2:#EFE7D2; --border:#DFD3B8; --border-strong:#B9AA88;
    --ink:#241F1B; --ink-muted:#595959; --ink-faint:#6E6558;
    --accent:#AD1E2E; --accent-soft:#F7E3E4; --accent-ink:#8A1724; --on-accent:#FFFFFF;
    --good:#0A6E61; --good-pure:#54BCAB; --good-soft:#DDF1ED;
    --bad:#B33F28;  --bad-pure:#EF765E;  --bad-soft:#FBE7E1;
    --warn:#8F6100; --warn-pure:#FAB000; --warn-soft:#FDF0D2;
    --clay:#834C6E; --clay-pure:#B36F9B; --clay-soft:#F2E6EE;
    --shadow:0 1px 2px rgba(74,44,18,.06), 0 10px 28px rgba(74,44,18,.06);
    --overlay:rgba(36,26,14,.45);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#17120E; --surface:#211A15; --surface-2:#2C231C; --border:#3E3327; --border-strong:#5C4D3A;
      --ink:#F2E9DC; --ink-muted:#B5A895; --ink-faint:#8A7F70;
      --accent:#E8737E; --accent-soft:#3A1A1E; --accent-ink:#F4AEB4; --on-accent:#1A0E0F;
      --good:#63CDBB; --good-pure:#54BCAB; --good-soft:#12302C;
      --bad:#F2907A;  --bad-pure:#EF765E;  --bad-soft:#3A2019;
      --warn:#F0B33A; --warn-pure:#FAB000; --warn-soft:#342611;
      --clay:#C98FB4; --clay-pure:#B36F9B; --clay-soft:#2F1F2A;
      --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 28px rgba(0,0,0,.4);
      --overlay:rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#17120E; --surface:#211A15; --surface-2:#2C231C; --border:#3E3327; --border-strong:#5C4D3A;
    --ink:#F2E9DC; --ink-muted:#B5A895; --ink-faint:#8A7F70;
    --accent:#E8737E; --accent-soft:#3A1A1E; --accent-ink:#F4AEB4; --on-accent:#1A0E0F;
    --good:#63CDBB; --good-pure:#54BCAB; --good-soft:#12302C;
    --bad:#F2907A;  --bad-pure:#EF765E;  --bad-soft:#3A2019;
    --warn:#F0B33A; --warn-pure:#FAB000; --warn-soft:#342611;
    --clay:#C98FB4; --clay-pure:#B36F9B; --clay-soft:#2F1F2A;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 28px rgba(0,0,0,.4);
    --overlay:rgba(0,0,0,.6);
  }

  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:"Public Sans", ui-sans-serif, system-ui, sans-serif; font-size:20px; line-height:1.4; -webkit-tap-highlight-color:transparent;}
  h1,h2,h3{font-family:"Spectral", Georgia, serif; text-wrap:balance; margin:0; font-weight:600;}
  button{font-family:inherit; color:inherit; margin:0;}
  button:focus-visible, .focus-target:focus-visible{outline:4px solid var(--ink); outline-offset:3px;}
  .focus-target:focus{outline:none;}

  .app{min-height:100vh; display:flex; flex-direction:column; overflow-x:hidden;}

  /* ---------------- Topo ---------------- */
  .top{display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:16px; padding:12px 20px; min-height:76px;}
  .logo{display:block; width:48px; height:48px; object-fit:contain;}
  .prog{min-width:0; display:flex; flex-direction:column; gap:6px;}
  .prog-label{font-size:15px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-muted);}
  .prog-track{height:10px; background:var(--surface-2); border:1px solid var(--border); border-radius:2px; overflow:hidden;}
  .prog-fill{height:100%; background:var(--accent); transition:width .25s ease;}
  .back{
    display:inline-flex; align-items:center; gap:8px; min-height:64px; min-width:64px; padding:0 18px;
    background:transparent; border:2px solid var(--border-strong); border-radius:6px; font-size:19px; font-weight:600; cursor:pointer;
  }
  .back:active{background:var(--surface-2);}
  .back svg{flex:none;}

  /* ---------------- Telas ---------------- */
  .screen{width:100%; max-width:1000px; margin:0 auto; padding:8px 20px 32px; flex:1; display:flex; flex-direction:column; gap:22px; min-width:0;}
  @media (prefers-reduced-motion: no-preference){
    .screen{animation:enter .2s ease both;}
    @keyframes enter{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
  }
  .q-title{font-size:clamp(30px, 5vw, 50px); line-height:1.1; letter-spacing:-.01em;}
  .q-hint{margin:-10px 0 0; font-size:20px; color:var(--ink-muted);}

  /* Botões de ação */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:12px; min-height:72px; padding:0 34px;
    background:var(--accent); color:var(--on-accent); border:2px solid var(--accent); border-radius:6px;
    font-size:24px; font-weight:700; letter-spacing:.01em; cursor:pointer; transition:transform .1s ease, background .15s ease;
  }
  .btn:active{transform:scale(.985);}
  a.btn{text-decoration:none;}
  a.btn[aria-disabled="true"]{background:var(--surface-2); border-color:var(--border); color:var(--ink-faint); cursor:not-allowed;}
  .btn[disabled]{background:var(--surface-2); border-color:var(--border); color:var(--ink-faint); cursor:not-allowed;}
  .btn.ghost{background:transparent; color:var(--ink); border-color:var(--border-strong);}
  .btn.ghost:active{background:var(--surface-2);}
  .actions{display:flex; gap:14px; flex-wrap:wrap;}

  /* Opções */
  .opts{display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap:14px;}
  .opts.two{grid-template-columns:repeat(auto-fit, minmax(min(100%, 300px), 1fr));}
  .opts.two .opt{min-height:150px; font-size:34px; font-family:"Spectral", Georgia, serif;}
  .opts.list{grid-template-columns:1fr; max-width:680px;}
  .opts.days{grid-template-columns:repeat(auto-fit, minmax(min(100%, 200px), 1fr));}
  .opt{
    display:flex; align-items:center; gap:16px; min-height:80px; padding:12px 20px; text-align:left;
    background:var(--surface); border:2px solid var(--border-strong); border-radius:6px; cursor:pointer;
    font-size:24px; font-weight:600; line-height:1.2; transition:background .12s ease, border-color .12s ease;
  }
  .opt:active{background:var(--surface-2);}
  .opt .txt{display:flex; flex-direction:column; gap:3px; min-width:0;}
  .opt .sub{font-size:16px; font-weight:400; color:var(--ink-muted); line-height:1.25;}
  .opt.sel{background:var(--accent); border-color:var(--accent); color:var(--on-accent);}
  .opt.sel .sub{color:var(--on-accent); opacity:.85;}
  .opt.full{grid-column:1 / -1;}
  .box{flex:none; width:30px; height:30px; border:2px solid var(--border-strong); border-radius:4px; display:inline-flex; align-items:center; justify-content:center; background:var(--surface);}
  .box svg{display:none;}
  .opt.sel .box{background:var(--on-accent); border-color:var(--on-accent);}
  .opt.sel .box svg{display:block; color:var(--accent);}

  /* Teclado numérico */
  .age-wrap{display:flex; flex-direction:column; align-items:center; gap:14px; width:100%;}
  .age-display{display:flex; align-items:baseline; justify-content:center; gap:14px; min-height:104px; width:100%; max-width:440px; border-bottom:4px solid var(--accent);}
  .age-num{font-family:"Spectral", Georgia, serif; font-size:clamp(76px, 12vh, 104px); font-weight:600; line-height:1; font-variant-numeric:tabular-nums;}
  .age-num.empty{color:var(--ink-faint);}
  .age-unit{font-size:26px; color:var(--ink-muted);}
  .age-hint{min-height:26px; margin:0; font-size:19px; color:var(--bad); text-align:center;}
  .keypad{display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; width:100%; max-width:440px;}
  .key{
    min-height:clamp(64px, 9.5vh, 80px); background:var(--surface); border:2px solid var(--border-strong); border-radius:6px;
    font-size:32px; font-weight:600; cursor:pointer; font-variant-numeric:tabular-nums;
  }
  .key:active{background:var(--surface-2);}
  .key.small{font-size:19px;}
  .key.go{background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-size:19px; font-weight:700;}
  .key.go[disabled]{background:var(--surface-2); border-color:var(--border); color:var(--ink-faint); cursor:not-allowed;}

  /* ---------------- Boas-vindas ---------------- */
  .welcome{justify-content:center; gap:28px; padding-top:12px;}
  .roda{display:flex; width:168px; height:10px;}
  .roda span{flex:1;}
  .roda .a{background:var(--warn-pure);} .roda .b{background:var(--bad-pure);} .roda .c{background:var(--good-pure);} .roda .d{background:var(--clay-pure);}
  .w-eyebrow{font-size:17px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--accent-ink); margin:0;}
  .w-title{font-size:clamp(48px, 9vw, 96px); line-height:1; letter-spacing:-.02em; font-weight:700;}
  .w-lead{font-size:clamp(22px, 3vw, 30px); line-height:1.35; max-width:640px; margin:0; color:var(--ink);}
  .w-start{align-self:flex-start; min-height:88px; padding:0 56px; font-size:32px;}
  .w-actions{display:flex; flex-wrap:wrap; align-items:center; gap:16px 20px;}
  .w-actions .w-start{align-self:auto;}
  .w-host{min-height:72px; font-size:22px; padding:0 28px; text-align:center; justify-content:center;}
  .ask.host{border-left-color:var(--good-pure, #54BCAB);}
  .w-meta{margin:0; font-size:16px; color:var(--ink-faint); display:flex; gap:8px 18px; flex-wrap:wrap;}

  /* ---------------- Resultado ---------------- */
  .result{max-width:1040px; gap:26px; padding-top:0;}
  .r-main{display:grid; grid-template-columns:minmax(0,1fr); gap:0; border-top:10px solid var(--accent);}
  .r-left{padding:20px 0 0; min-width:0;}
  .r-eyebrow{margin:0 0 6px; font-size:16px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--accent-ink);}
  .r-name{font-size:clamp(36px, 6.4vw, 60px); line-height:1.04; letter-spacing:-.015em; font-weight:700; margin-bottom:12px; overflow-wrap:anywhere;}
  .rows{margin:0; display:flex; flex-direction:column;}
  .row{display:grid; grid-template-columns:132px minmax(0,1fr); gap:6px 20px; align-items:baseline; padding:13px 0; border-top:2px solid var(--border);}
  .row dt{font-size:15px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-muted);}
  .row dd{margin:0; min-width:0; overflow-wrap:anywhere;}
  .val{font-size:clamp(25px, 3.6vw, 34px); font-weight:600; line-height:1.15;}
  .val-sub{display:block; margin-top:4px; font-size:20px; font-weight:500; color:var(--ink-muted); line-height:1.25;}
  .val-sub.near{color:var(--good); font-weight:600;}
  .r-side{padding:16px 0 0; display:flex; flex-direction:column; gap:16px; min-width:0;}
  .seal{align-self:flex-start; display:inline-flex; align-items:center; gap:12px; padding:10px 18px 10px 14px; border-radius:4px; font-size:22px; font-weight:700;}
  .seal i{display:block; width:16px; height:16px; flex:none;}
  .seal.otimo{background:var(--good-soft); color:var(--good);} .seal.otimo i{background:var(--good-pure);}
  .seal.bom{background:var(--warn-soft); color:var(--warn);} .seal.bom i{background:var(--warn-pure);}
  .seal.parcial{background:var(--clay-soft); color:var(--clay);} .seal.parcial i{background:var(--clay-pure);}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin:0; padding:0; list-style:none;}
  .chips li{padding:6px 12px; font-size:17px; font-weight:500; background:var(--surface); border:1px solid var(--border-strong); border-radius:3px;}
  .avisos{display:flex; flex-direction:column; gap:6px;}
  .aviso{margin:0; padding:8px 12px; font-size:17px; color:var(--warn); background:var(--warn-soft); border-left:4px solid var(--warn-pure);}
  .talk{margin:0; padding:12px 14px; font-size:19px; font-weight:600; background:var(--accent-soft); color:var(--accent-ink); border-left:4px solid var(--accent);}

  .others h2{font-size:clamp(26px, 4vw, 34px); margin-bottom:14px;}
  .others-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap:14px;}
  .other{padding:16px 18px 18px; background:var(--surface); border:1px solid var(--border-strong); border-top:4px solid var(--border-strong); border-radius:4px; min-width:0;}
  .other h3{font-size:26px; line-height:1.15; margin-bottom:10px; overflow-wrap:anywhere;}
  .other p{margin:0 0 4px; font-size:19px; overflow-wrap:anywhere;}
  .other .k{font-size:13px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-muted); margin-right:8px;}
  .empty-box{max-width:680px; padding:22px 24px; background:var(--surface); border-left:8px solid var(--clay-pure); font-size:26px; line-height:1.35;}

  /* Tela larga: resultado em duas colunas para caber sem rolar em 1024x768 */
  @media (min-width: 900px){
    .r-main{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr); gap:0 40px;}
    .r-side{padding-top:20px;}
  }

  /* ---------------- Pedido de contato ---------------- */
  .ask{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:14px 24px; padding:16px 20px; background:var(--surface); border:1px solid var(--border-strong); border-left:6px solid var(--clay-pure); border-radius:4px;}
  .ask p{margin:0; flex:1 1 320px; font-size:21px; font-weight:600; line-height:1.3;}
  .ask .btn{min-height:64px; font-size:22px; padding:0 28px;}
  .contact{max-width:1000px;}
  .contact-grid{display:grid; grid-template-columns:minmax(0,1fr); gap:24px;}
  .contact-col{display:flex; flex-direction:column; gap:20px; min-width:0;}
  .field{display:flex; flex-direction:column; gap:8px;}
  .field-label{font-size:15px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-muted);}
  .input{
    width:100%; min-height:72px; padding:10px 18px; font-family:inherit; font-size:26px; font-weight:500; color:var(--ink);
    background:var(--surface); border:2px solid var(--border-strong); border-radius:6px;
  }
  .input:focus{outline:4px solid var(--ink); outline-offset:3px; border-color:var(--ink);}
  .phone-display{display:flex; align-items:center; justify-content:center; min-height:76px; width:100%; max-width:440px; margin:0 auto; border-bottom:4px solid var(--accent);}
  .phone-num{font-family:"Spectral", Georgia, serif; font-size:clamp(34px, 6.5vw, 46px); font-weight:600; line-height:1; font-variant-numeric:tabular-nums; letter-spacing:.01em;}
  .phone-num.empty{color:var(--ink-faint);}
  .age-hint.neutral{color:var(--ink-muted);}
  .key-space{min-height:1px;}
  .textarea{min-height:124px; resize:vertical; font-size:22px; line-height:1.35; display:block;}
  .field-foot{display:flex; justify-content:space-between; align-items:baseline; gap:16px;}
  .field-help{font-size:16px; color:var(--ink-muted); line-height:1.3;}
  .counter{flex:none; font-size:16px; color:var(--ink-muted); font-variant-numeric:tabular-nums;}
  .other-pick{margin-top:12px; width:100%; min-height:64px; font-size:21px; padding:0 20px;}
  .opt.consent{align-items:flex-start; font-size:19px; font-weight:500; line-height:1.4; padding:16px 18px;}
  .opt.consent .box{margin-top:2px;}
  .opt.consent:focus-visible{outline:4px solid var(--ink); outline-offset:3px;}
  .status{margin:0; min-height:26px; font-size:18px; color:var(--ink-muted);}
  .err-detail{margin:6px 0 0; font-size:14px; font-weight:400; line-height:1.3; color:var(--ink-muted); overflow-wrap:anywhere;}
  .err-box{margin:0; padding:14px 16px; font-size:20px; font-weight:600; line-height:1.35; color:var(--bad); background:var(--bad-soft); border-left:6px solid var(--bad-pure);}
  .team-note{margin:0; max-width:640px; padding:10px 14px; font-size:17px; line-height:1.35; color:var(--warn); background:var(--warn-soft); border-left:4px solid var(--warn-pure);}
  .anote{display:flex; flex-direction:column; gap:10px; padding:16px 18px; background:var(--surface); border:1px solid var(--border-strong); border-left:6px solid var(--clay-pure); border-radius:4px; min-width:0;}
  .anote[hidden]{display:none;}
  .anote h3{font-size:24px;}
  .anote-txt{margin:0; font-family:inherit; font-size:19px; line-height:1.45; white-space:pre-wrap; overflow-wrap:anywhere; user-select:text; -webkit-user-select:text;}
  .thanks{max-width:720px; justify-content:center; gap:24px; padding-top:16px;}
  .thanks .w-lead{font-size:clamp(22px, 3vw, 28px);}
  @media (min-width: 900px){
    .contact-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr); grid-template-rows:auto auto 1fr; gap:24px 44px; align-items:start;}
    .area-names{grid-column:1; grid-row:1;} .area-obs{grid-column:1; grid-row:2;} .area-end{grid-column:1; grid-row:3;} .area-phone{grid-column:2; grid-row:1 / span 3;}
  }

  /* ---------------- Celular estreito ---------------- */
  @media (max-width: 560px){
    body{font-size:18px;}
    .top{gap:10px; padding:10px 16px;}
    .back{padding:0 12px; font-size:17px;}
    .screen{padding:6px 16px 28px; gap:18px;}
    .opt{font-size:21px; min-height:72px; padding:10px 16px;}
    .opts.two .opt{font-size:30px; min-height:110px;}
    .btn{padding:0 24px; font-size:22px;}
    .w-start{padding:0 32px; font-size:28px; align-self:stretch;}
    .w-actions{flex-direction:column; align-items:stretch;}
    .w-actions .w-start{align-self:stretch;}
    .row{grid-template-columns:1fr; gap:2px; padding:11px 0;}
    .val{font-size:26px;}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; animation:none !important;}
  }
</style>

<div class="app" id="app"></div>

<script>
/*
 * Motor de pontuação do "Encontre seu PG" (Igreja Batista Koinonia).
 * Sem DOM, sem dependências. Em navegador: window.MatchEngine; em node: module.exports.
 *
 * API:
 *   MatchEngine.REGIOES  -> regiões onde a PESSOA mora
 *   MatchEngine.DIAS     -> dias da semana
 *   MatchEngine.ranquear(pgs, ans) -> [{pg, total, nivel, distancia, motivos, avisos}]
 */
(function (root) {
  'use strict';

  var REGIOES = [
    { id: 'acn', label: 'Águas Claras Norte', sub: 'Quadras 101 a 105 e Ruas Norte' },
    { id: 'acs', label: 'Águas Claras Sul', sub: 'Ruas Sul e Av. Parque' },
    { id: 'arn', label: 'Arniqueiras e chácaras', sub: 'SHA, Vereda da Cruz' },
    { id: 'are', label: 'Areal', sub: '' },
    { id: 'tag', label: 'Taguatinga e Vicente Pires', sub: '' },
    { id: 'gua', label: 'Guará', sub: '' },
    { id: 'sam', label: 'Samambaia e Recanto das Emas', sub: '' },
    { id: 'cei', label: 'Ceilândia', sub: '' },
    { id: 'pil', label: 'Plano Piloto e arredores', sub: 'Asa Sul, Asa Norte, Sudoeste, Noroeste, Lagos' },
    { id: 'sao', label: 'São Sebastião e Jardim Botânico', sub: '' },
    { id: 'out', label: 'Outro lugar', sub: 'Entorno ou outra cidade' }
  ];

  var DIAS = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado', 'Domingo'];

  // ---------------------------------------------------------------------------
  // Pesos (ficam juntos para facilitar a calibragem)
  // ---------------------------------------------------------------------------
  var PESO_LOCAL = { 0: 30, 0.5: 27, 1: 21, 2: 11, 3: 4 };
  var LOCAL_OUTRO_LUGAR = 12;
  var IDADE_MAX = 30;
  var IDADE_DESCONHECIDA = 15;
  var IDADE_PENALIDADE = 3.5; // pontos perdidos por ano fora da faixa
  var CORTE_OTIMO = 92;
  var CORTE_BOM = 75;

  // Fase de vida (adulto): [solteiro/namorando, casado, divorciado/viúvo]
  var FASE = {
    casais:            [3, 22, 4],
    maioria_casais:    [11, 20, 14],
    misto:             [18, 18, 18],
    solteiros:         [22, 6, 16],
    mulheres_solo:     [18, 0, 22],
    pais_adolescentes: [18, 22, 18],
    // Não previsto na spec (adulto num PG de adolescentes, ex.: Âncora 17 e 18, 18 anos):
    adolescentes:      [16, 2, 8],
    kids:              [0, 0, 0]
  };

  // ---------------------------------------------------------------------------
  // Proximidade entre regiões (0 mesma, 0.5 quase mesma, 1 vizinha, 2, 3 longe)
  // ---------------------------------------------------------------------------
  var AGLOMERADO = { acn: 1, acs: 1, ac: 1, arn: 1, are: 1, tag: 1 };

  function nivelProximidade(a, b) {
    if (a === b) return 0;
    var par = [a, b].sort().join('|');
    var A = AGLOMERADO[a], B = AGLOMERADO[b];

    if (A && B) {
      if (par === 'ac|acn' || par === 'ac|acs') return 0.5;
      return 1; // acn–acs e qualquer outro par dentro do aglomerado
    }
    // Pares explícitos fora do aglomerado (ordenados alfabeticamente)
    var t = {
      'gua|pil': 2, 'gua|sao': 3,
      'cei|sam': 2, 'gua|sam': 3, 'pil|sam': 3, 'sam|sao': 3,

    return 3;
  }

  function distanciaDeNivel(n) {
    if (n === 0 || n === 0.5) return 'aqui';
    if (n === 1) return 'vizinha';
    return 'longe';
  }

  // ---------------------------------------------------------------------------
  // Utilidades
  // ---------------------------------------------------------------------------
  function tem(arr, v) { return !!arr && arr.indexOf(v) !== -1; }

  function distanciaEtaria(pg, idade) {
    if (idade < pg.amin) return pg.amin - idade;
    if (idade > pg.amax) return idade - pg.amax;
    return 0;
  }

  function categoriaEstado(estado) {
    if (estado === 'casado') return 1;
    if (estado === 'divorciado' || estado === 'viuvo') return 2;

  function artigoDia(dia) {

  function normalizar(ans) {
    var idade = Number(ans.idade);
    var menor = idade < 18;

      idade: idade,
      menor: menor,
      genero: ans.genero,
      estado: menor ? null : (ans.estado || 'solteiro'),

  // ---------------------------------------------------------------------------

    if (p.menor) {
      if (pg.amin > idade + 3) return true;                                   // regra 1a
      if (pg.foco !== 'adolescentes' && pg.foco !== 'kids' && pg.amin >= 21) return true; // 1b
      if (pg.foco !== 'adolescentes' && pg.foco !== 'kids' && pg.amin > idade + 1) return true; // PG adulto "18+" não serve a menor
    } else {
      if (pg.amax <= 17) return true;                                          // regra 2
    }
    if (pg.foco === 'kids' && idade > 12) return true;                         // regra 3
    if (idade <= 12 && pg.amin > idade + 3) return true;                       // regra 3 (limite)

    if (pg.ai) {                                                               // regra 4
      var d = distanciaEtaria(pg, idade);
      if (d > (p.menor ? 3 : 10)) return true;
    }

    if (pg.foco === 'mulheres_solo' && (p.genero !== 'm' || p.estado === 'casado')) return true; // 5
    if (pg.foco === 'pais_adolescentes' && !tem(p.filhos, 'adolescentes')) return true;         // 6

    if (pg.kids === 'pequenos' && !tem(p.filhos, 'pequenos')) return true;     // regra 7
    if (pg.kids === 'qualquer' &&
        !tem(p.filhos, 'pequenos') && !tem(p.filhos, 'adolescentes')) return true;
    return false;
  }

  // ---------------------------------------------------------------------------
  // Pontuação por critério

  function pontosFase(pg, p) {

    }
    var linha = FASE[pg.foco] || FASE.misto;
    var pts = linha[categoriaEstado(p.estado)];

      else if (p.tempoCasado === 'mais5') pts -= 10;
    }
    return pts;
  }

  function pontosFilhos(pg, p) {

    var kids = pg.kids || '';

    if (tem(p.filhos, 'pequenos')) {
      var v = kids === 'pequenos' ? 12 : kids === 'qualquer' ? 10 : kids === '' ? 6 : 0;
      if (v > melhor) melhor = v;
    }
    if (tem(p.filhos, 'adolescentes')) {
      var w;
      if (kids === '') w = 6;
      else if (kids === 'qualquer') w = 8;
      else if (kids.indexOf('adolescentes:') === 0) {
        if (!p.idadeTeen) w = 10; // faixa do filho não informada
        else w = (kids === 'adolescentes:' + p.idadeTeen) ? 12 : 8;
      } else w = 0;
      if (w > melhor) melhor = w;

    if (!temFilhoEmCasa && (tem(p.filhos, 'nenhum') || tem(p.filhos, 'adultos'))) {

  function pontosDia(pg, p) {

  // ---------------------------------------------------------------------------

  function textoFaixa(faixa) {

  function motivoFase(pg, p, ptsFase) {

      case 'maioria_casais':
        return cat === 1 ? 'Maioria de casais, como você' : null;
      case 'solteiros':
        return cat === 0 ? 'Mais gente solteira, como você' : null;
      case 'misto':
        return 'Grupo misto, com várias fases da vida';
      case 'mulheres_solo':
        return 'Grupo de mulheres, como você';
      case 'pais_adolescentes':
        return 'Pais de adolescentes, como você';
      case 'adolescentes':
        return cat === 0 ? 'Feito para jovens da sua idade' : null;
      default:

    }
  }

  function motivoFilhos(pg, p, ptsFilhos) {
    if (p.menor || !pg.kids || ptsFilhos < 10) return null;
    if (pg.kids === 'pequenos') return 'Tem outras famílias com filhos pequenos';
    if (pg.kids.indexOf('adolescentes:') === 0) return 'Tem outras famílias com filhos adolescentes';
    if (pg.kids === 'qualquer') return 'Tem outras famílias com filhos';

  }

  // ---------------------------------------------------------------------------
  // Ranking
  // ---------------------------------------------------------------------------
  function avaliar(pg, p) {

    var avisos = [];

    // Localização
    if (p.regiao === 'out') {
      ptsLocal = LOCAL_OUTRO_LUGAR;
      distancia = 'outra';

      var nivel = nivelProximidade(p.regiao, pg.regiao);
      ptsLocal = PESO_LOCAL[nivel];
      distancia = distanciaDeNivel(nivel);

    var ptsIdade = pontosIdade(pg, p);
    var ptsFase = pontosFase(pg, p);
    var ptsFilhos = pontosFilhos(pg, p);
    var ptsDia = pontosDia(pg, p);

    var total = ptsLocal + ptsIdade + ptsFase + ptsFilhos + ptsDia + bonusEspecificidade(pg);
    total = Math.round(total * 100) / 100;

    // Motivos (só os que contam a favor)
    if (distancia === 'aqui') motivos.push('Fica na sua região');
    else if (distancia === 'vizinha') motivos.push('Fica numa região vizinha à sua');

    if (pg.ai && distanciaEtaria(pg, p.idade) === 0) {
      motivos.push(pg.faixa ? textoFaixa(pg.faixa) : 'Feito para a sua faixa etária');

    if (mf) motivos.push(mf);

    if (p.dias.length && pg.dia && !tem(p.dias, pg.dia)) {
      avisos.push('Acontece ' + artigoDia(pg.dia) + ' ' + pg.dia.toLowerCase() + ', não no dia que você indicou.');
    }
    if (p.dias.length && !pg.dia) avisos.push('O dia do encontro ainda não está definido.');
    if (distancia === 'longe') avisos.push('Fica mais longe da sua região.');

    if (pg.recem && p.estado === 'casado' && p.tempoCasado === 'mais5') {
      avisos.push('Grupo de recém-casados (até 5 anos de casamento).');
    }

    return {
      pg: pg,
      total: total,
      nivel: nivelDe(total),
      distancia: distancia,
      motivos: motivos,
      avisos: avisos

  }

  function ranquear(pgs, ans) {
    var p = normalizar(ans || {});

    if (!leadId) leadId = novoId();
    var r = d.respostas;
    function qs(k, v) { return encodeURIComponent(k) + '=' + encodeURIComponent(v == null ? '' : String(v)); }
    var partes = [
      qs('chave', CHAVE_PLANILHA), qs('id', leadId), qs('nome', d.nome), qs('responsavel', d.responsavel),
      qs('whatsapp', d.whatsappFormatado), qs('pg', d.pgNome), qs('lider', d.lider), qs('dia', d.dia),
      qs('horario', fmtHora(d.hora)), qs('local', d.local), qs('encaixe', NIVEL[d.nivel] || ''),
      qs('opcao1', opcaoTxt(d.outrasOpcoes[0])), qs('opcao2', opcaoTxt(d.outrasOpcoes[1])),
      qs('escolheu', d.escolheuOutraOpcao ? 'Sim (o quiz sugeriu: ' + d.pgSugeridoQuiz + ')' : 'Não'),
      qs('observacao', d.observacao), qs('idade', r.idade), qs('genero', GENERO_LABEL[r.genero] || ''),
      qs('estado', d.menor ? '' : (ESTADO_LABEL[r.estado] || '')),
      qs('filhos', d.menor ? '' : r.filhos.map(function (f) { return FILHOS_LABEL[f] || f; }).join(', ')),
      qs('regiao', r.regiaoNome), qs('dias', r.dias.length ? r.dias.join(', ') : 'Qualquer dia')
    ];
    return WEBAPP_URL + '?' + partes.join('&');
  }
  /* Bônus do modo planilha: tenta também o banco, em segundo plano e em silêncio (mesmo id, mesmo caminho). */
  function gravarDbSilencioso(doc, itemId) {
    (async function () {
      var a = await getAccess();
      if (!a.db || !a.uid || !doc) return;
      if (!parentDone) { await a.db.doc('leads/' + a.uid).set({ ativo: true }); parentDone = true; }
      await a.db.doc('leads/' + a.uid + '/items/' + itemId).set(doc);
    })().catch(function () {});
  }

  /* Texto do "Anote para o voluntário": só existe na tela enquanto o envio falhou; some no reset/Concluir/Refazer. */
  function backupText(d) {
    var L = [];
    if (!d) {
      L.push('Nome: ' + cleanName(contact.nome));
      if (isMinor() && cleanName(contact.resp)) L.push('Responsável: ' + cleanName(contact.resp));
      L.push('WhatsApp: ' + fmtPhone(contact.wa));
      if ((contact.obs || '').trim()) L.push('Observação: ' + contact.obs.trim());
      return L.join('\n');
    }
    L.push('Nome: ' + d.nome);
    if (d.menor) L.push('Responsável: ' + d.responsavel);
    L.push('WhatsApp' + (d.menor ? ' do responsável' : '') + ': ' + d.whatsappFormatado);
    L.push('');
    L.push('PG escolhido: ' + d.pgNome);
    L.push('Líder: ' + d.lider);
    L.push('Quando: ' + fmtQuando(d));
    L.push('Onde: ' + d.local);
    if (d.outrasOpcoes && d.outrasOpcoes.length) {
      L.push('');
      L.push('Outras opções:');
      d.outrasOpcoes.forEach(function (o) { L.push('- ' + o.pgNome + ' (líder: ' + o.lider + '; ' + fmtQuando(o) + '; ' + o.local + ')'); });
    }
    if (d.observacao) { L.push(''); L.push('Observação: ' + d.observacao); }
    return L.join('\n');
  }

  function screenContato() {
    var minor = isMinor();
    var nomeLabel = minor ? (ans.idade <= 12 ? 'Nome da criança' : 'Nome do adolescente') : 'Seu nome';
    var waLabel = minor ? 'WhatsApp do responsável' : 'WhatsApp';

    var nomeIn = el('input', { type: 'text', id: 'contato-nome', class: 'input', autocomplete: 'off', autocapitalize: 'words', autocorrect: 'off', spellcheck: 'false', maxlength: '80', enterkeyhint: 'done',
      oninput: function () { contact.nome = nomeIn.value; paint(); }, onkeydown: enterBlur });
    nomeIn.value = contact.nome;
    var respIn = null;
    if (minor) {
      respIn = el('input', { type: 'text', id: 'contato-responsavel', class: 'input', autocomplete: 'off', autocapitalize: 'words', autocorrect: 'off', spellcheck: 'false', maxlength: '80', enterkeyhint: 'done',
        oninput: function () { contact.resp = respIn.value; paint(); }, onkeydown: enterBlur });
      respIn.value = contact.resp;
    }
    function enterBlur(e) { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } }

    var obsIn = el('textarea', { id: 'contato-observacao', class: 'input textarea', rows: '3', maxlength: '300', autocomplete: 'off', spellcheck: 'false', 'aria-describedby': 'contato-observacao-ajuda',
      oninput: function () { contact.obs = obsIn.value; obsCount.textContent = obsIn.value.length + '/300'; if (SHEET_MODE) paint(); } });
    obsIn.value = contact.obs;
    var obsCount = el('span', { id: 'contato-observacao-contador', class: 'counter', text: contact.obs.length + '/300' });

    var num = el('span', { id: 'contato-whatsapp-valor', class: 'phone-num' });
    var hint = el('p', { id: 'contato-whatsapp-dica', class: 'age-hint', 'aria-live': 'polite' });
    function press(d) { if (contact.wa.length >= 11) return; contact.wa += d; paint(); }
    function erase() { contact.wa = contact.wa.slice(0, -1); paint(); }
    var keys = numKeys('tel-', press, erase, null);

    var consentBtn = el('button', { type: 'button', id: 'contato-consentimento', class: 'opt consent', role: 'checkbox', 'aria-checked': 'false',
      onclick: function () { contact.consent = !contact.consent; paint(); } },
      el('span', { class: 'box' }, svg(20, 20, ICON_CHECK, 4)),
      el('span', { class: 'txt', text: minor ? CONSENT_MINOR : CONSENT_ADULT }));

    var status = el('p', { id: 'contato-falta', class: 'status', 'aria-live': 'polite' });
    var errBox = el('p', { id: 'contato-erro', class: 'err-box', role: 'alert', hidden: true });
    var detBox = el('p', { id: 'contato-detalhe', class: 'err-detail', hidden: true });
    var sendBtn = SHEET_MODE
      ? el('a', { id: 'btn-enviar', class: 'btn', href: '#', target: '_blank', rel: 'noopener', 'aria-disabled': 'true', onclick: enviarLink }, 'Enviar')
      : el('button', { type: 'button', id: 'btn-enviar', class: 'btn', onclick: enviar }, 'Enviar');
    var linkDoc = null; /* cadastro usado no href atual (modo planilha) */
    var anoteTxt = el('pre', { id: 'anote-texto', class: 'anote-txt' });
    var copyBtn = el('button', { type: 'button', id: 'btn-copiar', class: 'btn ghost', onclick: copiar }, 'Copiar');
    var anote = el('section', { id: 'anote-cartao', class: 'anote', 'aria-label': 'Anote para o voluntário', hidden: true },
      el('h3', { text: 'Anote para o voluntário' }),
      el('p', { class: 'field-help', text: 'Mostre esta tela a um voluntário do Cuidar na recepção.' }),
      anoteTxt, el('div', { class: 'actions' }, copyBtn));
    function safeLead() { try { return buildLead(); } catch (e) { return null; } }
    function copiar() {
      var text = anoteTxt.textContent;
      function label(t) {
        copyBtn.textContent = t;
        setTimeout(function () { if (copyBtn.isConnected) copyBtn.textContent = 'Copiar'; }, 2500);
      }
      function fallback() {
        var done = false;
        try {
          var r = document.createRange(); r.selectNodeContents(anoteTxt);
          var sl = window.getSelection(); sl.removeAllRanges(); sl.addRange(r);
          try { done = !!document.execCommand('copy'); } catch (e) { done = false; }
        } catch (e) {}
        label(done ? 'Copiado' : 'Texto selecionado');
      }
      try {
        if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
          navigator.clipboard.writeText(text).then(function () { label('Copiado'); }, fallback);
          return;
        }
      } catch (e) {}
      fallback();
    }

    function missing() {
      var m = [];
      if (!nameOk(contact.nome)) m.push(minor ? nomeLabel.toLowerCase() : 'nome');
      if (minor && !nameOk(contact.resp)) m.push('nome do responsável');
      if (!phoneOk(contact.wa)) m.push('WhatsApp');
      if (!contact.consent) m.push('autorização');
      return m;
    }
    function paint() {
      var wa = contact.wa;
      num.textContent = wa ? fmtPhone(wa) : '(__) _____-____';
      num.classList.toggle('empty', !wa);
      var pe = phoneError(wa);
      hint.classList.toggle('neutral', !pe);
      hint.textContent = pe || (wa.length === 0 ? 'Digite o DDD e o número.' : (wa.length < 10 ? 'Faltam dígitos: o número tem DDD mais 8 ou 9 dígitos.' : ''));
      consentBtn.classList.toggle('sel', contact.consent);
      consentBtn.setAttribute('aria-checked', contact.consent ? 'true' : 'false');
      var miss = missing();
      status.textContent = miss.length ? 'Falta preencher: ' + miss.join(', ') + '.' : '';
      if (SHEET_MODE) {
        /* href recalculado a cada mudança; sem dados válidos fica '#' e desabilitado. */
        linkDoc = null;
        var href = '';
        if (!miss.length) { linkDoc = safeLead(); if (linkDoc) { try { href = sheetHref(linkDoc); } catch (e) { href = ''; } } }
        sendBtn.setAttribute('href', href || '#');
        sendBtn.setAttribute('aria-disabled', href ? 'false' : 'true');
        /* Fallback: dados ok mas o link não pôde ser montado. */
        var semLink = !miss.length && !href;
        anote.hidden = !semLink;
        if (semLink) { var tb = backupText(linkDoc); if (anoteTxt.textContent !== tb) anoteTxt.textContent = tb; }
        var pc = contactPct();
        var fl = document.getElementById('prog-fill'), br = document.getElementById('prog-bar');
        if (fl) fl.style.width = pc + '%';
        if (br) br.setAttribute('aria-valuenow', String(pc));
        return;
      }
      sendBtn.disabled = miss.length > 0 || contact.sending;
      sendBtn.textContent = contact.sending ? 'Enviando…' : (contact.failed ? 'Tentar de novo' : 'Enviar');
      errBox.hidden = !contact.failed;
      errBox.textContent = contact.failed ? 'Não conseguimos guardar seu contato agora. Procure um voluntário do Cuidar aqui na recepção.' : '';
      detBox.hidden = !contact.failed;
      detBox.textContent = contact.failed ? 'Detalhe para a equipe: ' + contact.detail : '';
      anote.hidden = !contact.failed;
      if (contact.failed) {
        var t = backupText(safeLead());
        if (anoteTxt.textContent !== t) anoteTxt.textContent = t;
      }
      var pct = contactPct();
      var fill = document.getElementById('prog-fill'), bar = document.getElementById('prog-bar');
      if (fill) fill.style.width = pct + '%';
      if (bar) bar.setAttribute('aria-valuenow', String(pct));
    }

    /* Modo planilha: o link navega sozinho (aba nova de confirmação); aqui só vamos para o sucesso
       e tentamos o banco em segundo plano. Sem href válido, o clique não faz nada. */
    function enviarLink(e) {
      var href = sendBtn.getAttribute('href');
      if (!linkDoc || !href || href === '#' || missing().length || leadSent) { e.preventDefault(); return; }
      var my = epoch, doc = linkDoc, itemId = leadId;
      leadSent = true;
      sucessoPlanilha = true;
      gravarDbSilencioso(doc, itemId);
      setTimeout(function () {
        if (my !== epoch) return;
        contact = freshContact();
        Array.prototype.forEach.call(document.querySelectorAll('input, textarea'), function (i) { i.value = ''; });
        goTo('sucesso');
      }, 0);
    }

    function enviar() {
      if (contact.sending || leadSent || missing().length) return;
      var my = epoch;
      contact.sending = true; contact.failed = false; contact.detail = ''; paint();
      var doc = null, timer, timedOut = false;
      try { doc = buildLead(); } catch (e) { doc = null; }
      if (!leadId) leadId = novoId();
      var itemId = leadId;
      function ok() {
        clearTimeout(timer);
        if (my !== epoch || leadSent) return;
        leadSent = true;
        contact = freshContact();
        Array.prototype.forEach.call(document.querySelectorAll('input, textarea'), function (i) { i.value = ''; });
        goTo('sucesso');
      }
      function fail(err) {
        clearTimeout(timer);
        if (my !== epoch || leadSent) return;
        contact.sending = false; contact.failed = true; contact.detail = failDetail(err); paint();
      }
      /* Grava em leads/<uid>/items/<leadId> com set: o mesmo id nas repetições e no envio tardio nunca duplica. */
      var attempt = (async function () {
        var a = await getAccess();
        if (!a.db) throw { code: 'db_indisponivel' };
        if (!a.uid) throw { code: 'sem_uid' };
        if (!doc) throw { code: 'sem_pg' };
        /* Documento pai (deixa o admin descobrir os ids): uma vez por carregamento, antes do item, valor constante. */
        if (!parentDone) {
          await a.db.doc('leads/' + a.uid).set({ ativo: true });
          parentDone = true;
        }
        await a.db.doc('leads/' + a.uid + '/items/' + itemId).set(doc);
      })();
      attempt.then(function () {
        /* Sucesso tardio, depois do tempo limite: o contato foi gravado, então conclui em vez de deixar duplicar. */
        ok();
      }, function (e) { if (!timedOut) fail(e); });
      timer = setTimeout(function () { timedOut = true; fail({ code: 'timeout' }); }, SEND_TIMEOUT_MS);
    }

    paint();
    var left = el('div', { class: 'contact-col area-names' },
      el('div', { class: 'field' }, el('label', { class: 'field-label', for: 'contato-nome', text: nomeLabel }), nomeIn),
      minor ? el('div', { class: 'field' }, el('label', { class: 'field-label', for: 'contato-responsavel', text: 'Nome do responsável' }), respIn) : null);
    var right = el('div', { class: 'contact-col area-phone' },
      el('span', { class: 'field-label', id: 'contato-whatsapp-rotulo', text: waLabel }),
      el('div', { class: 'phone-display', role: 'status', 'aria-labelledby': 'contato-whatsapp-rotulo' }, num),
      hint,
      el('div', { class: 'age-wrap' }, el('div', { class: 'keypad', role: 'group', 'aria-label': 'Teclado numérico' }, keys)));
    var obs = el('div', { class: 'contact-col area-obs' },
      el('div', { class: 'field' },
        el('label', { class: 'field-label', for: 'contato-observacao', text: 'Observações para a equipe (opcional)' }),
        obsIn,
        el('div', { class: 'field-foot' }, el('span', { id: 'contato-observacao-ajuda', class: 'field-help', text: 'Ex.: só consigo atender à noite; prefiro mensagem no WhatsApp.' }), obsCount)));
    var end = el('div', { class: 'contact-col area-end' }, consentBtn, status, errBox, detBox, el('div', { class: 'actions' }, sendBtn), anote);
    return el('main', { class: 'screen contact' },
      el('h2', { class: 'q-title focus-target', tabindex: '-1', text: 'Um voluntário entra em contato' }),
      el('p', { class: 'q-hint', text: minor ? 'Preencha com os dados do responsável.' : 'É opcional. Seus dados ficam só com a equipe do Cuidar.' }),
      el('div', { class: 'contact-grid' }, left, right, obs, end));
  }

  function screenSucesso() {
    return el('main', { class: 'screen thanks' },
      el('div', { class: 'roda', 'aria-hidden': 'true' }, el('span', { class: 'a' }), el('span', { class: 'b' }), el('span', { class: 'c' }), el('span', { class: 'd' })),
      el('h2', { id: 'sucesso-titulo', class: 'w-title focus-target', tabindex: '-1', style: 'font-size:clamp(40px,7vw,68px)', text: 'Recebemos seu contato' }),
      el('p', { id: 'sucesso-texto', class: 'w-lead', text: sucessoPlanilha
        ? 'Pronto! Uma aba de confirmação abriu. Um voluntário do Cuidar vai entrar em contato.'
        : 'Um voluntário do Cuidar vai entrar em contato com você em breve.' }),
      sucessoPlanilha ? el('p', { id: 'sucesso-equipe', class: 'team-note', text: 'Equipe: feche a aba de confirmação e volte para esta aba antes do próximo visitante.' }) : null,
      el('button', { type: 'button', id: 'btn-concluir', class: 'btn w-start', onclick: resetAll }, 'Concluir'));
  }

  /* ---------- topo + render ---------- */
  var SCREENS = { idade: screenIdade, genero: screenGenero, estado: screenEstado, tempo: screenTempo,
    filhos: screenFilhos, teen: screenTeen, regiao: screenRegiao, dias: screenDias };

  function topBar() {
    var isQ = step !== 'welcome' && step !== 'result' && step !== 'contato' && step !== 'sucesso';
    var p = path();
    var idx = p.indexOf(step);
    var prog = null;
    if (isQ && idx >= 0) {
      var pct = Math.round(((idx + 1) / (p.length + 1)) * 100);
      prog = el('div', { class: 'prog' },
        el('span', { id: 'prog-label', class: 'prog-label', text: 'Pergunta ' + (idx + 1) + ' de ' + p.length }),
        el('div', { class: 'prog-track', role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': '100', 'aria-valuenow': String(pct), 'aria-label': 'Progresso do quiz' },
          el('div', { class: 'prog-fill', style: 'width:' + pct + '%' })));
    }
    if (step === 'contato') {
      prog = el('div', { class: 'prog' },
        el('span', { id: 'prog-label', class: 'prog-label', text: 'Pedido de contato' }),
        el('div', { id: 'prog-bar', class: 'prog-track', role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': '100', 'aria-valuenow': String(contactPct()), 'aria-label': 'Progresso do pedido de contato' },
          el('div', { id: 'prog-fill', class: 'prog-fill', style: 'width:' + contactPct() + '%' })));
    }
    return el('header', { class: 'top' },
      el('img', { class: 'logo', src: LOGO, alt: 'Koinonia' }),
      prog || el('div'),
      (step === 'welcome' || step === 'sucesso') ? el('div') : el('button', { type: 'button', id: 'btn-voltar', class: 'back', onclick: back }, svg(22, 22, ICON_BACK, 3), 'Voltar'));
  }

  function render() {
    idadeKeyHandler = null;
    if (step === 'idade') idadeBuf = idadeBuf === '' && ans.idade != null ? String(ans.idade) : idadeBuf;
    var body;
    if (!ENG && step !== 'welcome') {
      body = el('main', { class: 'screen' }, el('h2', { class: 'q-title focus-target', tabindex: '-1', text: 'Algo deu errado' }),
        el('p', { class: 'q-hint', text: 'Não foi possível carregar o quiz. Fale com um voluntário do Cuidar.' }),
        el('div', { class: 'actions' }, el('button', { type: 'button', id: 'btn-refazer', class: 'btn', onclick: resetAll }, 'Voltar ao início')));
    } else if (step === 'welcome') body = screenWelcome();
    else if (step === 'result') body = screenResult();
    else if (step === 'contato') body = screenContato();
    else if (step === 'sucesso') body = screenSucesso();
    else body = SCREENS[step]();
    app.replaceChildren(topBar(), body);
    var t = app.querySelector('.focus-target');
    if (t) { try { t.focus({ preventScroll: true }); } catch (e) {} }
    window.scrollTo(0, 0);
  }

  render();
  probe();
})();
</script>
