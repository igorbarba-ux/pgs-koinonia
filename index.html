<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PGs Koinonia</title>
<style>
  :root{
    --bg:#F4EEDC; --surface:#FFFFFF; --border:#DFD3B8;
    --ink:#241F1B; --ink-muted:#595959;
    --accent:#AD1E2E; --accent-soft:#F7E3E4; --accent-ink:#8A1724;
    --shadow:0 1px 2px rgba(74,44,18,.06), 0 10px 28px rgba(74,44,18,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#17120E; --surface:#211A15; --border:#3E3327;
      --ink:#F2E9DC; --ink-muted:#B5A895;
      --accent:#E8737E; --accent-soft:#3A1A1E; --accent-ink:#F4AEB4;
      --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 28px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box;}
  body{margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Public Sans",sans-serif; padding:24px;}
  .wrap{width:100%; max-width:440px; display:flex; flex-direction:column; gap:18px; text-align:center;}
  h1{font-size:26px; margin:0 0 4px;}
  p.sub{margin:0 0 10px; color:var(--ink-muted); font-size:15px;}
  a.card{
    display:block; text-decoration:none; color:var(--ink); background:var(--surface);
    border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow);
    padding:20px 22px; text-align:left; transition:transform .15s ease, border-color .15s ease;
  }
  a.card:hover{transform:translateY(-2px); border-color:var(--accent);}
  a.card .eyebrow{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent-ink); font-weight:700;}
  a.card h2{margin:4px 0 4px; font-size:19px;}
  a.card .desc{font-size:13.5px; color:var(--ink-muted); line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>PGs Koinonia</h1>
    <p class="sub">Escolha o painel que você precisa</p>
  </div>
  <a class="card" href="lideres/">
    <div class="eyebrow">Para líderes</div>
    <h2>Episkopos · Epíscopo</h2>
    <div class="desc">Painel dos líderes de PG: agenda, campus, ministérios e manual.</div>
  </a>
  <a class="card" href="encontre/">
    <div class="eyebrow">Para visitantes</div>
    <h2>Encontre seu PG</h2>
    <div class="desc">Responda algumas perguntas e descubra o Pequeno Grupo ideal pra você.</div>
  </a>
</div>
</body>
</html>
